# Garde la base Supabase éveillée : le plan gratuit met le projet en pause
# après 7 jours sans activité. Une petite lecture deux fois par semaine suffit.
# (Clé publique, la même que celle du site : elle ne permet que d'ajouter des avis.)
name: Garder Supabase éveillé

on:
  schedule:
    - cron: "17 8 * * 1,4"   # lundi et jeudi, ~10 h à Paris
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Petite requête vers la base
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://gfxpldjnrcoxdodidkze.supabase.co/rest/v1/retours?select=id&limit=1" \
            -H "apikey: sb_publishable_aW40Jc0ujRbiuFvm4HC76w_hOSO_LLQ")
          echo "Réponse de Supabase : $code"
          test "$code" -lt 500
