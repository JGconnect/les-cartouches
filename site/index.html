<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Les Cartouches</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    color-scheme: dark;
    --bg:#181022;
    --surface:#291a3a;
    --surface-2:#33224a;
    --ink:#f4ecff;
    --ink-soft:#c3b3d8;
    --ink-faint:#8b7aa5;
    --line:#3d2b54;
    --oui:#f5b700;
    --oui-ink:#241a00;
    --non:#7c6cff;
    --accent:#ff4d8d;
    --soft:#3ddc97;
    --epice:#f5b700;
    --trash:#ff4d6d;
    --ga:#ff4d8d;              /* accent du jeu courant */
    --radius:22px;
    --shadow:0 18px 50px -20px rgba(0,0,0,.7);
    --display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
    --body:"Instrument Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;font-family:var(--body);color:var(--ink);
    background:
      radial-gradient(120% 80% at 15% -10%, #2a1640 0%, transparent 55%),
      radial-gradient(120% 90% at 100% 110%, #2b0f38 0%, transparent 50%),
      var(--bg);
    -webkit-font-smoothing:antialiased;
  }
  .app{min-height:100%;max-width:520px;margin:0 auto;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}

  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:34px}
  .brand{font-family:var(--display);font-weight:800;letter-spacing:.16em;font-size:15px;text-transform:uppercase;color:var(--ink);background:none;border:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .brand span{color:var(--accent)}
  .back{display:none;align-items:center;gap:6px;background:none;border:none;cursor:pointer;color:var(--ink-faint);font-family:var(--body);font-weight:600;font-size:13.5px;padding:6px 0;-webkit-tap-highlight-color:transparent}
  .back:hover{color:var(--ink-soft)}
  .back.show{display:inline-flex}
  .progress{font-variant-numeric:tabular-nums;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
  .progress[hidden]{display:none}

  .stage{flex:1;display:flex;flex-direction:column}
  .screen{flex:1;display:flex;flex-direction:column}
  .screen[hidden]{display:none!important}

  /* ---------- HUB ---------- */
  .hub{gap:6px;padding-top:10px}
  .hub .kicker{font-size:12.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);font-weight:600;text-align:center}
  .hub h1{font-family:var(--display);font-weight:800;font-size:clamp(40px,13vw,64px);line-height:.92;margin:6px 0 4px;letter-spacing:-.02em;text-align:center;text-wrap:balance}
  .hub .sub{color:var(--ink-soft);font-size:15px;text-align:center;margin:0 auto 12px;max-width:32ch;line-height:1.5}
  .games{display:grid;gap:12px;margin-top:6px}
  .gcard{
    cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--surface);
    border-radius:var(--radius);padding:16px 18px;display:flex;gap:15px;align-items:center;
    font-family:inherit;color:inherit;-webkit-tap-highlight-color:transparent;transition:transform .12s ease,border-color .12s ease;
  }
  .gcard:active{transform:translateY(2px)}
  .gcard:hover{border-color:var(--gc)}
  .gcard .em{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:color-mix(in srgb,var(--gc) 22%, var(--surface-2))}
  .gcard .txt{flex:1;min-width:0}
  .gcard .nm,.gcard .tg{display:block}
  .gcard .nm{font-family:var(--display);font-weight:800;font-size:18px;line-height:1.1}
  .gcard .tg{font-size:13px;color:var(--ink-faint);margin-top:3px;line-height:1.35}
  .gcard .go{flex:none;color:var(--gc);font-size:16px;font-weight:700}
  .fineprint{font-size:12px;color:var(--ink-faint);line-height:1.5;margin:18px 4px 0;text-align:center}

  /* ---------- INTRO ---------- */
  .intro{justify-content:center;gap:20px;text-align:center;padding:8px 4px 20px}
  .intro .em{width:74px;height:74px;border-radius:20px;display:grid;place-items:center;font-size:38px;margin:0 auto;background:color-mix(in srgb,var(--ga) 22%, var(--surface-2))}
  .intro h2{font-family:var(--display);font-weight:800;font-size:clamp(38px,11vw,56px);line-height:.95;margin:0;letter-spacing:-.02em;text-wrap:balance}
  .intro .tg{color:var(--ink-soft);font-size:16px;line-height:1.5;max-width:32ch;margin:0 auto}
  .rules{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;text-align:left;display:grid;gap:13px}
  .rule{display:flex;gap:14px;align-items:flex-start}
  .rule .num{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:13px;background:var(--surface-2);color:var(--ink)}
  .rule p{margin:0;font-size:14px;line-height:1.45;color:var(--ink-soft)}
  .rule b{color:var(--ink);font-weight:600}
  .ambiance{display:grid;gap:10px}
  .ambiance .lbl{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;text-align:center}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .seg button{cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);font-family:var(--body);font-weight:600;font-size:13.5px;padding:13px 6px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:7px;transition:all .12s ease;-webkit-tap-highlight-color:transparent}
  .seg button .d{width:10px;height:10px;border-radius:50%}
  .seg button .d.soft{background:var(--soft)}.seg button .d.epice{background:var(--epice)}.seg button .d.trash{background:var(--trash)}
  .seg button .s{font-size:10.5px;color:var(--ink-faint);font-weight:500}
  .seg button.on{border-color:var(--ink);background:var(--surface-2);color:var(--ink)}
  .seg button.on .s{color:var(--ink-soft)}

  /* ---------- PLAY ---------- */
  .play{gap:16px;padding-top:6px}
  .banner{background:linear-gradient(135deg,var(--surface),var(--surface-2));border:1px solid var(--line);border-radius:var(--radius);padding:15px 18px;display:flex;align-items:center;gap:14px}
  .banner .em{font-size:24px;line-height:1}
  .banner .lbl{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
  .banner .name{font-family:var(--display);font-weight:800;font-size:19px;margin-top:2px}
  .body{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:16px;padding:6px 2px}
  .chip{align-self:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;padding:7px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink-soft);display:inline-flex;align-items:center;gap:8px}
  .chip .dot{width:8px;height:8px;border-radius:50%;background:var(--ga)}
  .chip .dot.soft{background:var(--soft)}.chip .dot.epice{background:var(--epice)}.chip .dot.trash{background:var(--trash)}
  .qtext{font-family:var(--display);font-weight:700;font-size:clamp(26px,6.6vw,38px);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
  .relance{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:14px 16px;min-height:62px;display:flex;flex-direction:column;justify-content:center;gap:6px}
  .relance .lbl{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ga);font-weight:600}
  .relance .txt{font-size:15.5px;line-height:1.4;color:var(--ink)}
  .relance.empty .txt{color:var(--ink-faint)}
  .instr{color:var(--ink-soft);font-size:14.5px;line-height:1.5;max-width:30ch;margin:0 auto}
  .duo{display:grid;gap:12px;width:100%;max-width:420px;margin:0 auto}
  .opt{cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:16px 18px;display:flex;gap:14px;align-items:center;color:inherit;font-family:inherit;-webkit-tap-highlight-color:transparent;transition:transform .12s ease,border-color .12s ease,background .12s ease}
  .opt:active{transform:translateY(2px)}
  .opt .k{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:16px;background:var(--surface-2);color:var(--ink-soft)}
  .opt .t{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.18}
  .opt.sel{border-color:var(--ga);background:color-mix(in srgb,var(--ga) 16%, var(--surface))}
  .opt.sel .k{background:var(--ga);color:#fff}
  .instr .g{color:var(--oui);font-weight:600}
  .strip{display:flex;align-items:center;justify-content:center;gap:10px;font-size:12.5px;letter-spacing:.08em;color:var(--ink-faint);font-weight:600;text-transform:uppercase;flex-wrap:wrap}
  .tag2{display:inline-flex;gap:6px}
  .tag2 b{font-family:var(--display);font-weight:800;padding:3px 10px;border-radius:8px;font-size:12.5px}
  .tag2 .y{background:var(--oui);color:var(--oui-ink)}.tag2 .x{background:var(--non);color:#fff}

  .ring{position:relative;width:170px;height:170px;margin:0 auto;display:grid;place-items:center}
  .ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
  .ring .track{fill:none;stroke:var(--surface-2);stroke-width:10}
  .ring .arc{fill:none;stroke:var(--ga);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
  .ring .num{font-family:var(--display);font-weight:800;font-size:60px;font-variant-numeric:tabular-nums;line-height:1}
  .ring.done .arc{stroke:var(--trash)}
  .ring.done .num{color:var(--trash)}

  .foot{display:grid;gap:10px;padding-top:8px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row-crack{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
  .btn{-webkit-tap-highlight-color:transparent;cursor:pointer;font-family:var(--display);font-weight:700;font-size:18px;border:none;border-radius:var(--radius);padding:17px;width:100%;background:var(--ga);color:#fff;letter-spacing:.02em;box-shadow:var(--shadow);transition:transform .12s ease,filter .12s ease}
  .btn:active{transform:translateY(2px);filter:brightness(1.06)}
  .btn:disabled{opacity:.4;cursor:default;box-shadow:none}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink-soft);box-shadow:none;font-size:15px;font-family:var(--body);font-weight:600;padding:14px}
  .btn.drink{background:var(--oui);color:var(--oui-ink)}
  .btn.sm{font-size:15px;padding:14px}

  /* ---------- END ---------- */
  .end{justify-content:center;text-align:center;gap:18px}
  .end .em{font-size:46px}
  .end .big{font-family:var(--display);font-weight:800;font-size:clamp(38px,12vw,58px);line-height:.95;margin:0;text-wrap:balance}
  .end p{color:var(--ink-soft);font-size:16px;line-height:1.5;max-width:30ch;margin:0 auto}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  /* ---------- SETUP (joueurs + pénalités) ---------- */
  .setup{display:grid;gap:12px;margin:4px 0 14px}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:grid;gap:12px}
  .plbl{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;display:flex;align-items:center;gap:8px}
  .plbl .cnt{color:var(--accent);font-variant-numeric:tabular-nums}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .pchip{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 13px;font-weight:600;font-size:14px}
  .alive{justify-content:center}
  .alive .pchip{padding:5px 13px;font-size:13px}
  .alive .pchip.cur{border-color:var(--ga);background:color-mix(in srgb,var(--ga) 22%, var(--surface-2))}
  .alive .pchip.out{opacity:.38;text-decoration:line-through}
  .px{background:none;border:none;color:var(--ink-faint);font-size:17px;line-height:1;cursor:pointer;width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
  .px:hover{color:var(--ink);background:var(--line)}
  .addrow{display:flex;gap:8px}
  .addrow input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--ink);font-family:var(--body);font-size:16px}
  .addrow input::placeholder{color:var(--ink-faint)}
  .addrow input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  .add{flex:none;cursor:pointer;border:none;border-radius:14px;padding:0 16px;background:var(--surface-2);color:var(--ink);font-family:var(--body);font-weight:600;font-size:14px}
  .add:hover{background:var(--line)}
  .hint{margin:0;font-size:12.5px;color:var(--ink-faint);line-height:1.45}
  .seg.two{grid-template-columns:1fr 1fr}
  .modeline{margin:0;font-size:13px;color:var(--ink-faint);font-weight:600}
  button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  .tally{display:block;margin-top:5px;font-size:12px;color:var(--ink-soft);font-weight:600;font-variant-numeric:tabular-nums}
  .fb{margin-top:14px}
  .rate{text-align:left;width:100%}
  .rate input{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--ink);font-family:var(--body);font-size:16px;width:100%}
  .rate input::placeholder{color:var(--ink-faint)}
  .vbtn{cursor:pointer;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-soft);font-family:var(--body);font-weight:600;font-size:15px;padding:14px 8px;border-radius:16px;-webkit-tap-highlight-color:transparent;transition:all .12s ease}
  .vbtn.on{border-color:var(--ga);background:color-mix(in srgb,var(--ga) 18%, var(--surface));color:var(--ink)}
  .vbtn:disabled{cursor:default}
  .bilan{width:100%;min-height:160px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;resize:vertical}
  .linkbtn{background:none;border:none;color:var(--ink-faint);font-family:var(--body);font-weight:600;font-size:13.5px;cursor:pointer;padding:8px;justify-self:center;text-decoration:underline;text-underline-offset:3px}
  .linkbtn:hover{color:var(--ink-soft)}

  /* ---------- FEUILLE DE PÉNALITÉ ---------- */
  .sheet{position:fixed;inset:0;z-index:20;background:rgba(10,6,16,.72);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
  .sheet-card{width:100%;max-width:484px;background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:26px 22px 20px;text-align:center;display:grid;gap:12px;box-shadow:var(--shadow);animation:up .22s ease-out}
  .sheet-card .sem{font-size:44px;line-height:1}
  .sheet-card .slbl{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--ga);font-weight:600}
  .sheet-card .stxt{margin:0;font-family:var(--display);font-weight:700;font-size:22px;line-height:1.2;text-wrap:balance}
  [hidden]{display:none!important}
  @keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
</style>
</head>
<body><div class="app">

    <button class="brand" id="brand">LES <span>CARTOUCHES</span></button>

  <div class="stage">

  </div>
</div>

  function game(id){for(var i=0;i<GAMES.length;i++)if(GAMES[i].id===id)return GAMES[i];}

  /* ---------------- OUTILS ---------------- */
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tt=a[i];a[i]=a[j];a[j]=tt;}return a;}
  function cascadePartie(n){
    var idxs=[];for(var i=0;i<CASCADE.length;i++)idxs.push(i);
    idxs=shuffle(idxs).slice(0,Math.min(n,CASCADE.length)).sort(function(a,b){return a-b;});
    return idxs.map(function(i){return CASCADE[i];});
  }

  function wireFeedback(){
    if(REMOTE||!votes.length)return;
    el("copyb").addEventListener("click",function(){
      var txt=bilan(),ta=el("bilan");
      ta.value=txt;
      function fallback(){ta.hidden=false;ta.focus();ta.select();el("fbmsg").textContent="Sélectionne le texte ci-dessus et copie-le.";}
      try{
        navigator.clipboard.writeText(txt).then(function(){el("fbmsg").textContent="Bilan copié. Colle-le dans WhatsApp ou par SMS.";},fallback);
      }catch(e){fallback();}
    });

  /* cartes déjà vues sur ce téléphone : les nouvelles passent en premier, cycle complet avant de revoir une carte */
  function seenKey(c){return typeof c==="string"?c:JSON.stringify(c);}
  function loadSeen(){try{return JSON.parse(localStorage.getItem("cart_seen")||"{}")||{};}catch(e){return {};}}
  function saveSeen(o){try{localStorage.setItem("cart_seen",JSON.stringify(o));}catch(e){}}
  function freshFirst(id,arr,n){
    var all=loadSeen(),seen=all[id]||[];
    var un=arr.filter(function(c){return seen.indexOf(seenKey(c))<0;});
    var old=arr.filter(function(c){return seen.indexOf(seenKey(c))>=0;});
    var pick=un.concat(old).slice(0,n);
    if(un.length<=n)seen=[];
    all[id]=seen.concat(pick.map(seenKey));saveSeen(all);
    return pick;
  }

  /* ---------------- LANCEMENT ---------------- */
  function startGame(){
    vics=players.length>=2?shuffle(players):shuffle(VICTIMS);
    idx=0;rIdx=0;
    switch(G.type){
      case"grill":deck=shuffle(OUINON.filter(function(s){return LEVELS[ambiance].indexOf(s.l)>=0;}));showProg=true;break;
      case"trap":deck=shuffle(NINON);showProg=false;break;
      case"menteur":deck=shuffle(MENTEUR);showProg=true;break;
      case"deck":deck=shuffle(COUPABLE);showProg=true;break;
      case"cascade":deck=cascadePartie(G.partie);showProg=true;break;
      case"chrono":deck=shuffle(CHRONO);showProg=false;break;
      case"tribunal":deck=shuffle(TRIBUNAL);showProg=true;break;
      case"dilemme":deck=shuffle(DILEMME);showProg=true;break;
    }
    if(G.partie&&G.type!=="cascade")deck=freshFirst(G.id,deck,Math.min(G.partie,deck.length));
    show("play");
    renderRound();
  }

  function prog(){el("progress").textContent="Manche "+(idx+1)+" / "+deck.length;}
  function nextVictim(){return vics[idx%vics.length];}
  function advance(){idx++;if(idx>=deck.length){endGame();return;}rIdx=0;renderRound();}
  function goBack(){if(idx>0){idx--;rIdx=0;renderRound();}}

  /* ---------------- RING ---------------- */
  function ringHTML(){return '<div class="ring" id="ring"><svg viewBox="0 0 200 200" aria-hidden="true"><circle class="track" cx="100" cy="100" r="88"></circle><circle class="arc" id="arc" cx="100" cy="100" r="88"></circle></svg><div class="num" id="tnum">0</div></div>';}
  function runTimer(secs,onZero){
    clearT();
    var C=2*Math.PI*88,left=secs;
    var arc=el("arc"),num=el("tnum"),ring=el("ring");
    arc.style.strokeDasharray=C;
    function paint(){num.textContent=left;arc.style.strokeDashoffset=C*(1-left/secs);}
    paint();
    timer=setInterval(function(){
      left--;
      if(left<=0){left=0;paint();clearT();ring.classList.add("done");if(onZero)onZero();return;}
      paint();
    },1000);
  }

  /* ---------------- RENDER PAR TYPE ---------------- */
  function renderRound(){
    if(showProg){el("progress").hidden=false;prog();}else{el("progress").hidden=true;}
    var P=el("s-play");
    cur=nextVictim();
    if(G.type==="grill")return renderGrill(P);
    if(G.type==="trap")return renderTrap(P);
    if(G.type==="menteur")return renderMenteur(P);
    if(G.type==="deck")return renderCoupable(P);
    if(G.type==="cascade")return renderCascade(P);
    if(G.type==="chrono")return renderChrono(P);
    if(G.type==="tribunal")return renderTribunal(P);
    if(G.type==="dilemme")return renderDilemme(P);
  }

  function bannerHTML(g,who){return '<div class="banner"><span class="em">'+g.em+'</span><div><div class="lbl">'+g.vic+'</div><div class="name">'+esc(who)+'</div></div></div>';}

  function renderGrill(P){

        '<div class="chip"><span class="dot '+q.l+'"></span>'+q.c+' · '+LVLNAME[q.l]+'</div>'+

  function renderTrap(P){

        pool=shuffle(deck);pi=0;
        if(pool.length>1&&pool[0]===lastQ){pool.push(pool.shift());}
      }
      lastQ=pool[pi++];return lastQ;
    }
    /* relances-pièges (toujours fermées) */
    var RELANCES=["Vraiment ?","Sûr·e ?","Tu confirmes ?","C'est définitif ?","Tu le jurerais ?","Même devant ta mère ?",
      "Même après trois verres ?","Même pour cent euros ?","Tu veux changer ta réponse ?","Tu mens, là, non ?",
      "Tu veux qu'on vérifie ?","Tu assumes ?","Et tu en es fier·e ?","Tu le redirais demain ?",
      "Tu en es certain·e ?","Tu le penses vraiment ?","Tu le dirais devant ton ex ?"];

    var canSurv=players.length>=2,surv=canSurv;
    var roster=shuffle(canSurv?players:VICTIMS);
    var alive=roster.slice(),out=[];
    var curP=null,nextP=null,bag=[],lastN=0;
    var SPEEDS={lent:4200,moyen:2800,rapide:1700};
    var speed="moyen";
    function idleMsg(){return surv?"L'appli appelle quelqu'un au hasard et le mitraille de questions. Un oui ou un non : éliminé·e. Dernier debout gagne.":(canSurv?"Mode libre : pas d'élimination, juste des pénalités.":"Ajoute au moins 2 prénoms sur l'accueil pour pouvoir jouer en mode survivant.");}

      '<div class="banner"><span class="em">'+G.em+'</span><div><div class="lbl">Sur la sellette</div><div class="name" id="who">—</div></div></div>'+
      '<div class="body">'+
        '<div class="chip"><span class="dot"></span><span id="tmode">'+(surv?'Mode survivant':'Interrogatoire')+'</span></div>'+
        '<h2 class="qtext" id="q">Choisis un rythme, puis lance.</h2>'+
        '<p class="instr" id="tstatus">'+idleMsg()+'</p>'+
        (canSurv?'<div class="chips alive" id="alive"></div>':'')+
        (canSurv?'<div class="ambiance"><div class="lbl">Mode</div><div class="seg two" id="tm"><button data-m="surv" class="on">🏆 Survivant<span class="s">élimination</span></button><button data-m="libre">🎲 Libre<span class="s">sans élimination</span></button></div></div>':'')+
        '<div class="ambiance"><div class="lbl">Rythme</div><div class="seg" id="spd">'+
          '<button data-s="lent">Lent</button>'+
          '<button data-s="moyen" class="on">Moyen</button>'+
          '<button data-s="rapide">Rapide</button>'+
        '</div></div>'+
      '</div>'+
      '<div class="strip">Interdit de dire <span class="tag2"><b class="y">OUI</b><b class="x">NON</b></span> sinon '+I()+'</div>'+
      '<div class="foot">'+
        '<button class="btn" id="run">▶️ Lancer l\'interrogatoire</button>'+
        '<div class="row-crack"><button class="btn drink" id="crack">'+crackLbl()+'</button><button class="btn ghost" id="skip">Passer →</button></div>'+
        '<button class="btn" id="again" hidden>🔁 Nouvelle manche</button>'+
        '<button class="linkbtn" id="stop">Terminer la partie</button>'+
      '</div>';
    var qEl=el("q"),whoEl=el("who"),statusEl=el("tstatus"),runBtn=el("run"),againBtn=el("again");
    function drawAlive(){
      var box=el("alive");if(!box)return;box.hidden=!surv;
      box.innerHTML=roster.map(function(p){
        var cls="pchip"+(out.indexOf(p)>=0?" out":"")+(p===curP&&out.indexOf(p)<0?" cur":"");
        return '<span class="'+cls+'">'+esc(p)+'</span>';
      }).join("");

    drawAlive();
    function resetRound(){alive=roster.slice();out=[];bag=[];curP=null;nextP=null;lastN=0;}
    if(canSurv){
      Array.prototype.forEach.call(el("tm").querySelectorAll("button"),function(b){
        b.addEventListener("click",function(){
          var want=b.getAttribute("data-m")==="surv";if(want===surv)return;
          surv=want;
          Array.prototype.forEach.call(el("tm").querySelectorAll("button"),function(x){x.classList.toggle("on",x===b);});
          resetRound();
          el("tmode").textContent=surv?"Mode survivant":"Mode libre";
          el("crack").textContent=crackLbl();
          el("crack").disabled=false;el("skip").disabled=false;
          if(!againBtn.hidden){againBtn.hidden=true;runBtn.hidden=false;runBtn.textContent="▶️ Lancer l'interrogatoire";}
          if(!trapRun)statusEl.textContent=idleMsg();
          drawAlive();
        });
      });
    }
    Array.prototype.forEach.call(el("spd").querySelectorAll("button"),function(b){
      b.addEventListener("click",function(){
        speed=b.getAttribute("data-s");
        Array.prototype.forEach.call(el("spd").querySelectorAll("button"),function(x){x.classList.toggle("on",x===b);});
      });
    });
    function clean(s){return String(s).replace(/·/g,"");}
    /* personne suivante : ordre imprévisible, chacun passe avant qu'on recommence, jamais deux fois de suite */
    function nextPerson(){
      bag=bag.filter(function(p){return alive.indexOf(p)>=0;});
      if(!bag.length)bag=shuffle(alive);
      if(alive.length>1&&bag[0]===curP){
        if(bag.length>1){bag.push(bag.shift());}
        else{bag=shuffle(alive.filter(function(p){return p!==curP;})).concat([curP]);}
      }
      return bag.shift();
    }
    /* longueur de rafale : 1 à 4, jamais la même deux fois de suite */
    function burstLen(){
      var w=[[1,25],[2,30],[3,25],[4,20]].filter(function(x){return x[0]!==lastN;});
      var tot=w.reduce(function(s,x){return s+x[1];},0),r=Math.random()*tot,a=0,n=w[0][0];
      for(var i=0;i<w.length;i++){a+=w[i][1];if(r<a){n=w[i][0];break;}}
      lastN=n;return n;
    }
    function buildBurst(){
      var n=burstLen(),list=[{t:pickQ(),r:false}];
      for(var i=1;i<n;i++){
        if(!list[i-1].r&&Math.random()<0.5)list.push({t:pickR(),r:true});
        else list.push({t:pickQ(),r:false});
      }
      return list;
    }
    function step(){
      if(!trapRun)return;
      if(surv&&alive.length<=1){win();return;}
      curP=nextP||nextPerson();nextP=null;
      whoEl.textContent=curP;drawAlive();
      play(buildBurst(),0);
    }
    function play(list,i){
      if(!trapRun)return;
      var it=list[i];
      qEl.textContent=it.t;
      say((i===0?clean(curP)+". ":"")+it.t,function(){
        if(!trapRun)return;
        var last=(i>=list.length-1);
        var gap=last?SPEEDS[speed]:Math.round(SPEEDS[speed]*(list[i+1].r?0.55:0.8));
        trapT=setTimeout(function(){if(last){step();}else{play(list,i+1);}},gap);
      });
    }
    function startLoop(){
      trapRun=true;runBtn.textContent="⏸ Pause";
      statusEl.textContent="Réponds vite… sans « oui » ni « non » !";
      step();
    }
    function pauseLoop(){
      trapRun=false;if(trapT){clearTimeout(trapT);trapT=null;}shutUp();
      runBtn.textContent="▶️ Reprendre";statusEl.textContent="En pause. Reprends quand tu veux.";
    }
    function win(){
      trapRun=false;if(trapT){clearTimeout(trapT);trapT=null;}
      var w=alive[0];curP=w;drawAlive();
      whoEl.textContent=w;
      qEl.textContent="🏆 "+w+" gagne la manche !";
      statusEl.textContent="Dernier·ère debout. Nouvelle manche ?";
      runBtn.hidden=true;againBtn.hidden=false;
      el("crack").disabled=true;el("skip").disabled=true;
      say(clean(w)+" gagne la manche ! Bravo.",function(){});
    }
    runBtn.addEventListener("click",function(){trapRun?pauseLoop():startLoop();});
    el("crack").addEventListener("click",function(){
      if(!curP||out.indexOf(curP)>=0)return;
      var wasRunning=trapRun;if(trapRun)pauseLoop();
      var loser=curP;
      penalty(loser,function(){
        if(surv){
          var k=alive.indexOf(loser);
          if(k>=0){alive.splice(k,1);out.push(loser);}
          curP=null;whoEl.textContent="…";
          drawAlive();
          if(alive.length<=1){win();return;}
          statusEl.textContent=loser+" est éliminé·e. Plus que "+alive.length+" en jeu.";
          say(clean(loser)+" est éliminé. Au suivant !",function(){
            if(wasRunning){trapRun=true;runBtn.textContent="⏸ Pause";step();}
          });
        }else if(wasRunning){
          trapRun=true;runBtn.textContent="⏸ Pause";step();
        }
      });
    });
    el("skip").addEventListener("click",function(){
      shutUp();if(trapT){clearTimeout(trapT);trapT=null;}
      if(trapRun){step();}else{nextP=nextPerson();curP=nextP;whoEl.textContent=curP;drawAlive();}
    });
    againBtn.addEventListener("click",function(){
      roster=shuffle(roster);resetRound();
      againBtn.hidden=true;runBtn.hidden=false;
      el("crack").disabled=false;el("skip").disabled=false;
      whoEl.textContent="—";qEl.textContent="Nouvelle manche ! Tout le monde revient.";
      drawAlive();startLoop();
    });
    el("stop").addEventListener("click",function(){stopVoiceLoop();endGame();});
  }

  function renderMenteur(P){
    P.innerHTML=bannerHTML(G,cur)+
      '<div class="body">'+
        '<div class="chip"><span class="dot"></span>Vrai ou bluff</div>'+
        '<h2 class="qtext">'+deck[idx]+'</h2>'+
        '<p class="instr">Lis la phrase et dis si c\'est <b>vrai ou faux pour toi</b>… en mentant ou pas. Raconte, convaincs. Puis la table vote : <b>vérité ou mensonge ?</b></p>'+
      '</div>'+
      '<div class="foot">'+
        '<button class="btn drink" id="caught">La table a deviné → '+I()+'</button>'+
        '<button class="btn" id="bluff">La table s\'est trompée → la table '+I()+'</button>'+
        (idx>0?'<button class="linkbtn" id="prev">← Précédent</button>':'')+
      '</div>';
    el("caught").addEventListener("click",function(){penalty(cur,advance);});
    el("bluff").addEventListener("click",function(){penalty("toute la table",advance);});
    var pv=el("prev");if(pv)pv.addEventListener("click",goBack);
  }

  function renderCoupable(P){
    P.innerHTML=
      '<div class="body">'+
        '<div class="chip"><span class="dot"></span>Qui est le plus susceptible de…</div>'+
        '<h2 class="qtext">'+deck[idx]+'</h2>'+
        '<p class="instr">'+t(G.instr)+'</p>'+
      '</div>'+
      '<div class="foot"><div class="row2"><button class="btn drink" id="pen">Le coupable → '+I()+'</button><button class="btn ghost" id="nx">Suivant →</button></div>'+(idx>0?'<button class="linkbtn" id="prev">← Précédent</button>':'')+'</div>';
    el("pen").addEventListener("click",function(){penalty("le ou la plus désigné·e");});
    el("nx").addEventListener("click",advance);
    var pv=el("prev");if(pv)pv.addEventListener("click",goBack);
  }

  function renderCascade(P){
    P.innerHTML=
      '<div class="body">'+
        '<div class="chip"><span class="dot"></span>Palier '+(idx+1)+' / '+deck.length+'</div>'+
        '<h2 class="qtext">'+deck[idx]+'</h2>'+
        '<p class="instr">'+t(G.instr)+'</p>'+
      '</div>'+
      '<div class="foot"><div class="row2"><button class="btn drink" id="pen">Esquive → '+I()+'</button><button class="btn ghost" id="nx">Palier suivant →</button></div>'+(idx>0?'<button class="linkbtn" id="prev">← Palier précédent</button>':'')+'</div>';
    el("pen").addEventListener("click",function(){penalty("qui esquive");});
    el("nx").addEventListener("click",advance);
    var pv=el("prev");if(pv)pv.addEventListener("click",goBack);
  }

  function renderChrono(P){
    P.innerHTML=
      '<div class="body">'+
        '<div class="chip"><span class="dot"></span>Catégorie</div>'+
        '<h2 class="qtext">'+deck[idx%deck.length]+'</h2>'+
        ringHTML()+
        '<p class="instr" id="msg">Cinq secondes par personne. On lance dès que tu es prêt.</p>'+
      '</div>'+
      '<div class="foot">'+
        '<button class="btn" id="go">Lancer le chrono</button>'+
        '<div class="row2"><button class="btn drink" id="fail">A séché → '+I()+'</button><button class="btn ghost" id="nx">Autre catégorie →</button></div>'+
        '<button class="linkbtn" id="stop">Terminer la partie</button>'+
      '</div>';
    el("tnum").textContent=G.secs;
    el("go").addEventListener("click",function(){
      el("ring").classList.remove("done");
      el("go").textContent="Réussi, on relance";
      runTimer(G.secs,function(){el("msg").textContent="Trop lent ! "+I();});
    });
    el("fail").addEventListener("click",function(){clearT();penalty("celui ou celle qui a séché");});
    el("nx").addEventListener("click",function(){idx++;renderRound();});
    el("stop").addEventListener("click",endGame);
  }

  function renderDilemme(P){
    var d=deck[idx];
    P.innerHTML=bannerHTML(G,cur)+
      '<div class="body">'+
        (d.ctx?'<p class="instr">'+d.ctx+'</p>':'')+
        '<div class="duo">'+
          '<button class="opt" data-k="A"><span class="k">A</span><span class="t">'+d.a+'</span></button>'+
          '<button class="opt" data-k="B"><span class="k">B</span><span class="t">'+d.b+'</span></button>'+
        '</div>'+
      '</div>'+
      '<div class="foot"><div class="row2"><button class="btn drink" id="pen">Refuse de trancher → '+I()+'</button><button class="btn ghost" id="nx">Suivant →</button></div>'+(idx>0?'<button class="linkbtn" id="prev">← Précédent</button>':'')+'</div>';
    Array.prototype.forEach.call(P.querySelectorAll(".opt"),function(b){
      b.addEventListener("click",function(){
        Array.prototype.forEach.call(P.querySelectorAll(".opt"),function(x){x.classList.remove("sel");});
        b.classList.add("sel");
      });
    });
    el("pen").addEventListener("click",function(){penalty(cur);});
    el("nx").addEventListener("click",advance);
    var pv=el("prev");if(pv)pv.addEventListener("click",goBack);
  }

  function renderTribunal(P){
    P.innerHTML=bannerHTML(G,cur)+
      '<div class="body">'+
        '<div class="chip"><span class="dot"></span>Chef d\'accusation</div>'+
        '<h2 class="qtext">Accusé·e '+deck[idx]+'.</h2>'+
        ringHTML()+
        '<p class="instr" id="msg">Trente secondes pour plaider non coupable.</p>'+
      '</div>'+
      '<div class="foot">'+
        '<button class="btn ghost" id="go">Lancer la plaidoirie (30 s)</button>'+
        '<div class="row2"><button class="btn drink" id="guilty">Coupable → '+I()+'</button><button class="btn" id="free">Acquitté·e → accusateurs '+I()+'</button></div>'+
      '</div>';
    el("tnum").textContent=G.secs;
    el("go").addEventListener("click",function(){el("ring").classList.remove("done");runTimer(G.secs,function(){el("msg").textContent="Temps écoulé, au vote !";});});
    el("guilty").addEventListener("click",function(){clearT();penalty(cur,advance);});
    el("free").addEventListener("click",function(){clearT();penalty("les accusateurs",advance);});
  }

  /* ---------------- FIN ---------------- */
  function endGame(){
    clearT();showProg=false;el("progress").hidden=true;
    el("s-end").innerHTML=
      '<div class="em">'+G.em+'</div>'+
      '<h2 class="big">Partie terminée.</h2>'+
      '<p>Fin de cette partie de « '+G.name+' ». Une nouvelle donne pioche d\'autres cartes.</p>'+
      '<div class="panel rate">'+
        '<div class="plbl">Ce jeu vous a plu ?</div>'+
        '<div class="row2"><button class="vbtn" data-v="1">👍 On a aimé</button><button class="vbtn" data-v="-1">👎 Bof</button></div>'+
        '<input id="note" maxlength="200" placeholder="Un mot sur ce qui a marché ou pas (facultatif)" autocomplete="off">'+
        '<button class="btn sm" id="sendv" disabled>Enregistrer l\'avis</button>'+
        '<p class="hint" id="vmsg"></p>'+
      '</div>'+
      '<div class="foot"><button class="btn" id="replay">Nouvelle partie</button><button class="btn ghost" id="tohub">← Tous les jeux</button></div>';
    var pick=0;
    Array.prototype.forEach.call(el("s-end").querySelectorAll(".vbtn"),function(b){
      b.addEventListener("click",function(){
        pick=+b.getAttribute("data-v");
        Array.prototype.forEach.call(el("s-end").querySelectorAll(".vbtn"),function(x){x.classList.toggle("on",x===b);});
        el("sendv").disabled=false;
      });
    });
    el("sendv").addEventListener("click",function(){
      if(!pick)return;
      var rec={g:G.id,v:pick,note:el("note").value.trim().slice(0,200),mode:mode,n:players.length,at:new Date().toISOString(),sent:false};
      votes.push(rec);
      saveVotes();
      el("sendv").disabled=true;el("sendv").textContent="Avis enregistré";
      el("note").disabled=true;
      Array.prototype.forEach.call(el("s-end").querySelectorAll(".vbtn"),function(x){x.disabled=true;});
      if(REMOTE){
        el("vmsg").textContent="Envoi…";
        sendRemote(rec).then(function(){rec.sent=true;saveVotes();el("vmsg").textContent="Merci ! Avis envoyé.";},
          function(){el("vmsg").textContent="Enregistré. Il partira tout seul dès que le téléphone aura du réseau.";});
      }else{
        el("vmsg").textContent="Merci ! Il apparaît dans « Retours des tests » sur l'accueil.";
      }
    });
    el("replay").addEventListener("click",startGame);
    el("tohub").addEventListener("click",toHub);
    show("end");
  }

  function toHub(){G=null;document.documentElement.style.setProperty("--ga","#ff4d8d");buildHub();show("hub");}

  el("brand").addEventListener("click",toHub);
  el("back").addEventListener("click",toHub);

  buildHub();
  show("hub");
  flush();
})();
</script>
