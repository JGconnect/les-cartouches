<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#181022">
<meta name="description" content="Huit jeux de soirée qui se jouent avec un téléphone et une bande de potes.">
<meta property="og:title" content="Les Cartouches">
<meta property="og:description" content="Huit jeux de soirée qui se jouent avec un téléphone et une bande de potes.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%A5%3C/text%3E%3C/svg%3E">
<title>Les Cartouches</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#181022">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cartouches">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    color-scheme: dark;
    --bg:#181022;
    --surface:#291a3a;
    --surface-2:#33224a;
    --ink:#f4ecff;
    --ink-soft:#c3b3d8;
    --ink-faint:#8b7aa5;
    --line:#3d2b54;
    --oui:#f5b700;
    --oui-ink:#241a00;
    --non:#7c6cff;
    --accent:#ff4d8d;
    --soft:#3ddc97;
    --epice:#f5b700;
    --trash:#ff4d6d;
    --ga:#ff4d8d;              /* accent du jeu courant */
    --radius:22px;
    --shadow:0 18px 50px -20px rgba(0,0,0,.7);
    --display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
    --body:"Instrument Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;font-family:var(--body);color:var(--ink);
    background:
      radial-gradient(120% 80% at 15% -10%, #2a1640 0%, transparent 55%),
      radial-gradient(120% 90% at 100% 110%, #2b0f38 0%, transparent 50%),
      var(--bg);
    -webkit-font-smoothing:antialiased;
  }
  .app{min-height:100%;max-width:520px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) 18px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}

  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:34px}
  .brand{font-family:var(--display);font-weight:800;letter-spacing:.16em;font-size:15px;text-transform:uppercase;color:var(--ink);background:none;border:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .brand span{color:var(--accent)}
  .back{display:none;align-items:center;gap:6px;background:none;border:none;cursor:pointer;color:var(--ink-faint);font-family:var(--body);font-weight:600;font-size:13.5px;padding:6px 0;-webkit-tap-highlight-color:transparent}
  .back:hover{color:var(--ink-soft)}
  .back.show{display:inline-flex}
  .progress{font-variant-numeric:tabular-nums;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
  .progress[hidden]{display:none}
  .brand,.back,.progress{white-space:nowrap}
  @media (max-width:420px){.top{gap:8px}.brand{letter-spacing:.08em;font-size:13.5px}.progress{font-size:11px;letter-spacing:.04em}}

  .stage{flex:1;display:flex;flex-direction:column}
  .screen{flex:1;display:flex;flex-direction:column}
  .screen[hidden]{display:none!important}

  /* ---------- HUB ---------- */
  .hub{gap:6px;padding-top:10px}
  .hub .kicker{font-size:12.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);font-weight:600;text-align:center}
  .hub h1{font-family:var(--display);font-weight:800;font-size:clamp(40px,13vw,64px);line-height:.92;margin:6px 0 4px;letter-spacing:-.02em;text-align:center;text-wrap:balance}
  .hub .sub{color:var(--ink-soft);font-size:15px;text-align:center;margin:0 auto 12px;max-width:32ch;line-height:1.5}
  .games{display:grid;gap:12px;margin-top:6px}
  .sect{margin:22px 4px 2px}
  .sect .sh{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.01em}
  .sect .ss{font-size:13px;color:var(--ink-faint);margin-top:2px;line-height:1.4}
  .chips.cats{justify-content:center}
  .chips.cats .pchip,.chips.pick .pchip{cursor:pointer;color:var(--ink-soft);font-family:var(--body);padding:8px 14px}
  .chips.cats .pchip.on{border-color:var(--ga);background:color-mix(in srgb,var(--ga) 22%, var(--surface-2));color:var(--ink)}
  .chips.pick{justify-content:center}
  .chips.pick .pchip{font-size:16px;padding:12px 18px}
  .hints{display:grid;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
  .hints p{margin:0;font-size:14.5px;line-height:1.4;color:var(--ink)}
  .hints b{color:var(--ga);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-right:6px}
  .hints[hidden]{display:none}
  .dname{font-size:clamp(32px,9vw,48px)}
  .dstats{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink-soft);font-size:14px;padding:0 6px}
  .peek{background:var(--surface-2);border:1px dashed var(--ga);border-radius:14px;padding:10px 14px;font-size:15px}
  .peek[hidden]{display:none}
  .btn.yes{background:#2bb673}.btn.no{background:#e5484d}
  .btn.found{background:linear-gradient(135deg,var(--ga),#7c6cff)}
  .board{gap:8px;text-align:left}
  .brow{display:flex;align-items:center;gap:10px;font-size:15px}
  .brow .bk{width:26px;text-align:center}.brow .bn{flex:1;font-weight:600}.brow .bp{font-variant-numeric:tabular-nums;color:var(--ga);font-weight:700}
  .lhead{position:sticky;top:0;z-index:2;background:var(--bg);padding:6px 0 10px;display:grid;gap:8px}
  .lcat{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.15;text-align:center;text-wrap:balance}
  .lnums{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;font-weight:700;font-size:17px}
  .lnums .lt{color:var(--ga)}.lnums .lt.hurry{color:var(--trash)}
  .lbarw{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
  .lbar{height:100%;background:var(--ga);transition:width 1s linear}
  .lgrid{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;padding:4px 0 10px;flex:1;align-content:flex-start}
  .lchip{cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);font-family:var(--body);font-weight:600;font-size:14px;padding:9px 12px;border-radius:999px;-webkit-tap-highlight-color:transparent}
  .lchip.hard{border-style:dashed}
  .disc{font-size:64px;line-height:1;margin:6px auto}
  .disc.spin{animation:dspin 2.4s linear infinite}
  @keyframes dspin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  .songcard{display:flex;gap:14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
  .songcard img{width:64px;height:64px;border-radius:10px;flex:none;object-fit:cover}
  .songcard .st{font-family:var(--display);font-weight:800;font-size:18px;line-height:1.15}
  .songcard .sa{font-size:14px;color:var(--ink-soft);margin-top:3px}
  .credit{margin:0;font-size:11.5px;color:var(--ink-faint)}
  .lbonus{display:grid;gap:8px;text-align:center}.lbonus[hidden]{display:none}
  .lbonus .lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
  .lbx{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .missed .lbx{margin-top:10px}
  .lchip.sm{font-size:13px;padding:7px 11px}
  .lchip.miss{opacity:.6;border-style:dashed}
  .lchip.pop{animation:lpop .45s ease}
  @keyframes lpop{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
  .heard{margin:0;text-align:center;font-size:13px;color:var(--ink-faint);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .heard[hidden]{display:none}
  .lgrid.ten{display:grid;grid-template-columns:1fr 1fr;gap:9px;align-content:center}
  .lgrid.ten .lchip{border-radius:16px;padding:16px 10px;font-size:16px;line-height:1.2}
  .lchip.on{background:var(--ga);border-color:var(--ga);color:#241500}
  .lfoot{position:sticky;bottom:0;z-index:2;background:var(--bg);padding:10px 0 calc(6px + env(safe-area-inset-bottom,0px))}
  .row3{display:grid;grid-template-columns:1.6fr .6fr 1fr;gap:8px}
  .row3 .btn{padding:13px 8px;font-size:15px}
  .chips.pick .pchip.on{border-color:var(--ga);background:color-mix(in srgb,var(--ga) 30%, var(--surface-2));color:var(--ink)}
  .pad{gap:10px}.pad .pp{color:var(--ga);font-variant-numeric:tabular-nums;margin-left:4px}
  #qlvl,#btcat,#parcat{grid-template-columns:repeat(2,1fr)}
  .bigletter{font-family:var(--display);font-weight:800;font-size:110px;line-height:1;color:var(--ga);text-align:center}
  .bigletter.sm{font-size:72px}
  .brow2{display:flex;align-items:center;justify-content:center;gap:22px}.brow2 .ring{width:130px;height:130px;margin:0}.brow2 .ring .num{font-size:44px}
  .bcats{text-align:left;margin:0 auto;padding:14px 16px 14px 40px;background:var(--surface);border:1px solid var(--line);border-radius:16px;display:grid;gap:7px;font-size:16px;font-weight:600;width:100%;max-width:380px}
  .bcats li::marker{color:var(--ga);font-weight:800}
  .tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px 18px;display:grid;gap:12px}
  .tword{font-family:var(--display);font-weight:800;font-size:clamp(34px,10vw,50px);line-height:1.05;color:var(--ga)}
  .tlbl{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
  .tban{display:grid;gap:6px}.tban span{font-size:19px;font-weight:600;color:var(--trash);text-decoration:line-through;text-decoration-thickness:2px}
  .qtext.sm{font-size:22px}
  .quote{font-style:italic}
  .answer{background:var(--surface);border:1px solid var(--ga);border-radius:16px;padding:14px 16px;display:grid;gap:6px}
  .answer .aw{font-family:var(--display);font-weight:800;font-size:22px;color:var(--ga)}
  .answer .as{font-size:14.5px;color:var(--ink-soft);line-height:1.45}
  .answer .ac{font-size:13.5px;color:var(--ink-faint);line-height:1.45;font-style:italic;margin-top:2px}
  .answer.ok{border-color:#2bb673}.answer.ok .aw{color:#2bb673}.answer.ko{border-color:#e5484d}.answer.ko .aw{color:#e5484d}
  #qans,#vans,#aans{display:grid;gap:12px}#qans[hidden],#vans[hidden],#aans[hidden]{display:none}
  .hstart{font-size:17px;line-height:1.5;font-style:italic;color:var(--ink-soft);margin:0}
  .hturn{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:grid;gap:4px}
  .hturn .lbl{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin-top:6px}
  .hname{font-family:var(--display);font-weight:800;font-size:22px}
  .hword{font-family:var(--display);font-weight:800;font-size:clamp(32px,9vw,44px);color:var(--ga)}
  .inst{margin-top:18px;gap:8px}.inst .hint b{color:var(--ink)}
  .missed{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px;text-align:left}
  .missed summary{cursor:pointer;font-weight:600;color:var(--ink-soft)}
  .missed p{margin:10px 0 0;font-size:14px;line-height:1.6;color:var(--ink-soft)}
  .gcard{
    cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--surface);
    border-radius:var(--radius);padding:16px 18px;display:flex;gap:15px;align-items:center;
    font-family:inherit;color:inherit;-webkit-tap-highlight-color:transparent;transition:transform .12s ease,border-color .12s ease;
  }
  .gcard:active{transform:translateY(2px)}
  .gcard:hover{border-color:var(--gc)}
  .gcard .em{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:color-mix(in srgb,var(--gc) 22%, var(--surface-2))}
  .gcard .txt{flex:1;min-width:0}
  .gcard .nm,.gcard .tg{display:block}
  .gcard .nm{font-family:var(--display);font-weight:800;font-size:18px;line-height:1.1}
  .gcard .tg{font-size:13px;color:var(--ink-faint);margin-top:3px;line-height:1.35}
  .gcard .go{flex:none;width:34px}
  .gw{position:relative;display:grid}
  .mine h2{font-family:var(--display);font-weight:800;font-size:30px;margin:6px 0 4px}
  .mine .sub{margin-bottom:6px}
  .mform{display:grid;gap:10px}
  .mform input,.mform textarea{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--ink);font-family:var(--body);font-size:16px;width:100%;resize:vertical}
  .mform input::placeholder,.mform textarea::placeholder{color:var(--ink-faint)}
  .mform label{font-size:13px;color:var(--ink-faint);font-weight:600}
  .mlist{display:grid;gap:8px}
  .mitem{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px 8px 10px 14px;font-size:14.5px;line-height:1.4}
  .mitem .mt{flex:1;min-width:0;overflow-wrap:anywhere}.mitem .mt small{display:block;color:var(--ink-faint);font-size:12.5px;margin-top:2px}
  .mitem .mx{flex:none;border:0;background:none;color:var(--ink-faint);font-size:20px;line-height:1;width:34px;height:34px;cursor:pointer;border-radius:10px}
  .mgames .pchip{cursor:pointer;color:var(--ink-soft);padding:8px 13px}
  .mgames .pchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .mgames .pchip .n{font-size:11.5px;opacity:.75;margin-left:3px}
  .minebtn{display:block;width:100%;margin-top:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--radius);padding:14px 16px;font:inherit;font-weight:700;font-size:15.5px;cursor:pointer;text-align:left}
  .minebtn span{display:block;font-weight:500;font-size:13px;color:var(--ink-faint);margin-top:2px}
  .mlink{background:none;border:0;color:var(--ink-soft);text-decoration:underline;font:inherit;font-size:14px;cursor:pointer;padding:4px;justify-self:center}
  .tourp{margin-top:8px}.tourp .board{display:grid;gap:8px;margin:6px 0 10px}.tourp .bp{color:#ffd23f}
  .tour .bp{color:#ffd23f}
  .champ{font-family:var(--display);font-weight:800;font-size:24px;margin:4px 0 2px}
  .fav{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;background:none;
    font-size:22px;line-height:1;color:var(--ink-faint);cursor:pointer;border-radius:12px;-webkit-tap-highlight-color:transparent;font-family:inherit}
  .fav.on{color:#ffd23f}
  .fav:active{transform:translateY(-50%) scale(.85)}
  .net{display:inline-block;font-size:11px;font-weight:600;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:2px;font-family:var(--body,inherit)}
  .filters{display:flex;gap:8px;overflow-x:auto;margin:22px -4px 0;padding:2px 4px 4px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .filters button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:999px;padding:9px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
  .filters button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .surprise{display:block;width:100%;margin-top:12px;border:1px dashed var(--line);background:none;color:var(--ink);border-radius:var(--radius);padding:14px;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
  .surprise:active{transform:translateY(2px)}
  .fineprint{font-size:12px;color:var(--ink-faint);line-height:1.5;margin:18px 4px 0;text-align:center}

  /* ---------- INTRO ---------- */
  .intro{justify-content:center;gap:20px;text-align:center;padding:8px 4px 20px}
  .intro .em{width:74px;height:74px;border-radius:20px;display:grid;place-items:center;font-size:38px;margin:0 auto;background:color-mix(in srgb,var(--ga) 22%, var(--surface-2))}
  .intro h2{font-family:var(--display);font-weight:800;font-size:clamp(38px,11vw,56px);line-height:.95;margin:0;letter-spacing:-.02em;text-wrap:balance}
  .intro .tg{color:var(--ink-soft);font-size:16px;line-height:1.5;max-width:32ch;margin:0 auto}
  .rules{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;text-align:left;display:grid;gap:13px}
  .rule{display:flex;gap:14px;align-items:flex-start}
  .rule .num{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:13px;background:var(--surface-2);color:var(--ink)}
  .rule p{margin:0;font-size:14px;line-height:1.45;color:var(--ink-soft)}
  .rule b{color:var(--ink);font-weight:600}
  .ambiance{display:grid;gap:10px}
  .ambiance .lbl{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;text-align:center}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .seg button{cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);font-family:var(--body);font-weight:600;font-size:13.5px;padding:13px 6px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:7px;transition:all .12s ease;-webkit-tap-highlight-color:transparent}
  .seg button .d{width:10px;height:10px;border-radius:50%}
  .seg button .d.soft{background:var(--soft)}.seg button .d.epice{background:var(--epice)}.seg button .d.trash{background:var(--trash)}
  .seg button .s{font-size:10.5px;color:var(--ink-faint);font-weight:500}
  .seg button.on{border-color:var(--ink);background:var(--surface-2);color:var(--ink)}
  .seg button.on .s{color:var(--ink-soft)}

  /* ---------- PLAY ---------- */
  .play{gap:16px;padding-top:6px}
  .banner{background:linear-gradient(135deg,var(--surface),var(--surface-2));border:1px solid var(--line);border-radius:var(--radius);padding:15px 18px;display:flex;align-items:center;gap:14px}
  .banner .em{font-size:24px;line-height:1}
  .banner .lbl{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
  .banner .name{font-family:var(--display);font-weight:800;font-size:19px;margin-top:2px}
  .body{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:16px;padding:6px 2px}
  .chip{align-self:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;padding:7px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink-soft);display:inline-flex;align-items:center;gap:8px}
  .chip .dot{width:8px;height:8px;border-radius:50%;background:var(--ga)}
  .chip .dot.soft{background:var(--soft)}.chip .dot.epice{background:var(--epice)}.chip .dot.trash{background:var(--trash)}
  .qtext{font-family:var(--display);font-weight:700;font-size:clamp(26px,6.6vw,38px);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
  .relance{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:14px 16px;min-height:62px;display:flex;flex-direction:column;justify-content:center;gap:6px}
  .relance .lbl{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ga);font-weight:600}
  .relance .txt{font-size:15.5px;line-height:1.4;color:var(--ink)}
  .relance.empty .txt{color:var(--ink-faint)}
  .instr{color:var(--ink-soft);font-size:14.5px;line-height:1.5;max-width:30ch;margin:0 auto}
  .duo{display:grid;gap:12px;width:100%;max-width:420px;margin:0 auto}
  .opt{cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:16px 18px;display:flex;gap:14px;align-items:center;color:inherit;font-family:inherit;-webkit-tap-highlight-color:transparent;transition:transform .12s ease,border-color .12s ease,background .12s ease}
  .opt:active{transform:translateY(2px)}

  function sendRemote(rec){
    if(!REMOTE)return Promise.reject(new Error("off"));
    var h={"apikey":SUPABASE_KEY,"Content-Type":"application/json","Prefer":"return=minimal"};
    if(SUPABASE_KEY.indexOf("sb_")!==0)h["Authorization"]="Bearer "+SUPABASE_KEY;

  var flushing=false;
  function flush(){
    if(!REMOTE||flushing)return;

    (function next(i){
      if(i>=todo.length){flushing=false;saveVotes();return;}
      sendRemote(todo[i]).then(function(){todo[i].sent=true;next(i+1);},function(){next(i+1);});
    })(0);
  }

    var dt=new Date().toLocaleDateString("fr-FR");

    GAMES.map(function(g){var t0=tally(g.id);return{g:g,t:t0,n:t0.u+t0.d};})
      .sort(function(a,b){return (b.t.u-b.t.d)-(a.t.u-a.t.d)||b.n-a.n;})

  var SPEAK=("speechSynthesis" in window)&&("SpeechSynthesisUtterance" in window);

  function loadVoices(){
    if(!SPEAK)return;

    frVoice=vs.filter(function(v){return /^fr(-|_)?/i.test(v.lang);})[0]
          ||vs.filter(function(v){return /fran/i.test(v.name);})[0]||null;
  }
  if(SPEAK){loadVoices();try{window.speechSynthesis.onvoiceschanged=loadVoices;}catch(e){}}
  function say(text,onend){
    if(!SPEAK){setTimeout(function(){onend&&onend();},Math.min(3500,Math.max(1600,text.length*55)));return;}
    try{
      window.speechSynthesis.cancel();
      var u=new SpeechSynthesisUtterance(text);
      u.lang="fr-FR";if(frVoice)u.voice=frVoice;u.rate=1.05;u.pitch=1;
      var done=false;function fin(){if(done)return;done=true;onend&&onend();}
      u.onend=fin;u.onerror=fin;
      window.speechSynthesis.speak(u);
      setTimeout(fin,Math.min(12000,2000+text.length*110));
    }catch(e){setTimeout(function(){onend&&onend();},1600);}
  }

  var cTimer=null,hapEl=null;
  function haptic(pat){
    try{
      if(navigator.vibrate){navigator.vibrate(pat);return;}
      /* iPhone (Safari 18+) : un interrupteur natif déclenche un retour haptique */
      if(!hapEl){
        hapEl=document.createElement("label");hapEl.setAttribute("aria-hidden","true");
        hapEl.style.cssText="position:fixed;left:-99px;top:0;width:1px;height:1px;overflow:hidden;opacity:0";
        hapEl.innerHTML='<input type="checkbox" switch tabindex="-1">';document.body.appendChild(hapEl);
      }
      var n=Array.isArray(pat)?Math.ceil(pat.length/2):1;
      for(var i=0;i<n;i++)setTimeout(function(){hapEl.click();},i*180);
    }catch(e){}
  }
  function tickFx(left,box){
    if(left>0&&left<=3){haptic(35);if(box){box.classList.remove("warn");void box.offsetWidth;box.classList.add("warn");}}
    else if(left===0){haptic([220,90,220,90,320]);}
  }
  function countIn(cb){
    clearT();

    if(!o){o=document.createElement("div");o.id="countin";o.innerHTML='<div class="cnum" id="cnum"></div>';document.body.appendChild(o);}
    var steps=["3","2","1","C'est parti !"],i=0;
    o.hidden=false;
    (function step(){
      var n=el("cnum");n.textContent=steps[i];n.className="cnum"+(i===3?" go":"");void n.offsetWidth;n.classList.add("pop");
      haptic(i===3?140:40);
      cTimer=setTimeout(function(){
        i++;
        if(i<steps.length){step();return;}
        cTimer=null;o.hidden=true;if(cb)cb();
      },i===3?550:750);
    })();
  }

  /* cartes déjà vues sur ce téléphone : les nouvelles passent en premier, cycle complet avant de revoir une carte */
  function seenKey(c){return typeof c==="string"?c:JSON.stringify(c);}
  function loadSeen(){try{return JSON.parse(localStorage.getItem("cart_seen")||"{}")||{};}catch(e){return {};}}
  function saveSeen(o){try{localStorage.setItem("cart_seen",JSON.stringify(o));}catch(e){}}
  function freshFirst(id,arr,n){
    var all=loadSeen(),seen=all[id]||[];
    var un=arr.filter(function(c){return seen.indexOf(seenKey(c))<0;});
    var old=arr.filter(function(c){return seen.indexOf(seenKey(c))>=0;});
    var pick=un.concat(old).slice(0,n);
    if(un.length<=n)seen=[];
    all[id]=seen.concat(pick.map(seenKey));saveSeen(all);
    return pick;
  }

  /* ---------------- LANCEMENT ---------------- */
  function startGame(){
    vics=players.length>=2?shuffle(players):shuffle(VICTIMS);
    idx=0;rIdx=0;
    switch(G.type){
      case"grill":deck=shuffle(OUINON.filter(function(s){return LEVELS[ambiance].indexOf(s.l)>=0;}));showProg=true;break;
      case"trap":deck=shuffle(NINON);showProg=false;break;
      case"menteur":deck=shuffle(MENTEUR);showProg=true;break;
      case"deck":deck=shuffle(COUPABLE);showProg=true;break;
      case"cascade":deck=cascadePartie(G.partie);showProg=true;break;
      case"chrono":deck=shuffle(CHRONO.filter(famOK));showProg=false;break;
      case"tribunal":deck=shuffle(TRIBUNAL);showProg=true;break;
      case"dilemme":deck=shuffle(DILEMME);showProg=true;break;
      case"devine":deck=[];showProg=false;break;
      case"liste":var LF=LISTES.filter(function(x){return famOK(x.c);});deck=freshFirst("liste",shuffle(LF),LF.length);showProg=false;break;
      case"bac":deck=[];showProg=false;break;
      case"taboo":deck=freshAll("taboo",TABOO).filter(famOK);tPos=0;showProg=false;break;
      case"fredonne":deck=freshAll("fredonne",CHANSONS);fPos=0;showProg=false;break;
      case"quiadit":
        var byL=function(l){return CITATIONS.filter(function(c){return c.charAt(0)===l;});};
        if(qLvl==="mix")deck=freshFirst("quiadit_f",shuffle(byL("f")),5).concat(freshFirst("quiadit_m",shuffle(byL("m")),5),freshFirst("quiadit_d",shuffle(byL("d")),5));
        else deck=freshFirst("quiadit_"+qLvl,shuffle(byL(qLvl)),15);
        showProg=true;break;
      case"vraifaux":deck=shuffle(VRAIFAUX);showProg=true;break;
      case"histoire":deck=freshAll("histoire",HIST_DEBUTS);showProg=false;break;
      case"ousuisje":deck=freshFirst("ou_"+ouCat,shuffle(ouPool(ouCat)),ouPool(ouCat).length);showProg=false;break;
      case"avant":deck=freshFirst("av_"+avMode,shuffle(avPool(avMode)),avPool(avMode).length);showProg=false;break;
      case"blindtest":deck=freshFirst("bt_"+btCat,shuffle(btPool(btCat)),btPool(btCat).length);aPos=0;showProg=false;break;
      case"paroles":deck=freshFirst("par_"+parCat,shuffle(songPool(parCat)),songPool(parCat).length);aPos=0;showProg=false;break;
    }
    qScores={};finalHTML="";padHist=[];tourCounted=false;
    if(G.partie&&G.type!=="cascade")deck=freshFirst(G.id,deck,Math.min(G.partie,deck.length));
    if(MINE_GAMES[G.id]){deck=mineMix(G.id,deck);if(G.id==="taboo")tPos=0;}
    show("play");
    renderRound();
  }

  function runTimer(secs,onZero){
    clearT();

    arc.style.strokeDasharray=C;

        left--;

    var qEl=el("q"),whoEl=el("who"),statusEl=el("tstatus"),runBtn=el("run"),againBtn=el("again");

    function nextPerson(){
      bag=bag.filter(function(p){return alive.indexOf(p)>=0;});
      if(!bag.length)bag=shuffle(alive);
      if(alive.length>1&&bag[0]===curP){
        if(bag.length>1){bag.push(bag.shift());}
        else{bag=shuffle(alive.filter(function(p){return p!==curP;})).concat([curP]);}

    /* longueur de rafale : 1 à 4, jamais la même deux fois de suite */
    function burstLen(){
      var w=[[1,25],[2,30],[3,25],[4,20]].filter(function(x){return x[0]!==lastN;});
      var tot=w.reduce(function(s,x){return s+x[1];},0),r=Math.random()*tot,a=0,n=w[0][0];
      for(var i=0;i<w.length;i++){a+=w[i][1];if(r<a){n=w[i][0];break;}}
      lastN=n;return n;
    }
    function buildBurst(){
      var n=burstLen(),list=[{t:pickQ(),r:false}];
      for(var i=1;i<n;i++){
        if(!list[i-1].r&&Math.random()<0.5)list.push({t:pickR(),r:true});
        else list.push({t:pickQ(),r:false});
      }
      return list;
    }
    function step(){
      if(!trapRun)return;

      curP=nextP||nextPerson();nextP=null;

      if(!trapRun)return;

        if(!trapRun)return;
        var last=(i>=list.length-1);
        var gap=last?SPEEDS[speed]:Math.round(SPEEDS[speed]*(list[i+1].r?0.55:0.8));
        trapT=setTimeout(function(){if(last){step();}else{play(list,i+1);}},gap);
      });
    }

    function win(){

    el("crack").addEventListener("click",function(){

    });

  var TOUR_PTS=[3,2,1], tourCounted=false;
  function tourGet(){try{var v=JSON.parse(lsGet("cart_tour")||"null");if(v&&typeof v==="object"&&v.pts)return v;}catch(e){}return null;}
  function tourSet(v){if(v)lsSet("cart_tour",JSON.stringify(v));else{try{localStorage.removeItem("cart_tour");}catch(e){}}}
  function tourRank(pts){
    var ks=Object.keys(pts).sort(function(a,b){return pts[b]-pts[a];});
    return ks.map(function(k){return {n:k,p:pts[k],r:1+ks.filter(function(x){return pts[x]>pts[k];}).length};});
  }
  function tourBoard(T,medals){
    var rows=tourRank(T.pts);
    return rows.map(function(o){
      var ic=medals?(["🥇","🥈","🥉"][o.r-1]||o.r+"."):(o.r+".");
      return '<div class="brow"><span class="bk">'+ic+'</span><span class="bn">'+esc(o.n)+'</span><span class="bp">'+o.p+' pt'+(o.p>1?'s':'')+'</span></div>';

  /* À la fin d'un quiz : 3 / 2 / 1 points de tournoi pour le podium */
  function tourAward(){
    var T=tourGet();
    if(!T||!T.on||tourCounted||!G||G.cat!=="quiz")return "";
    var ks=Object.keys(qScores).filter(function(k){return T.pts.hasOwnProperty(k)&&qScores[k]>0;});
    if(!ks.length)return "";
    tourCounted=true;
    var gained={};
    ks.forEach(function(k){
      var r=1+ks.filter(function(x){return qScores[x]>qScores[k];}).length;
      if(r<=TOUR_PTS.length){gained[k]=TOUR_PTS[r-1];T.pts[k]+=TOUR_PTS[r-1];}
    });
    T.log.push({g:G.id,w:gained});
    tourSet(T);
    var gl=Object.keys(gained).sort(function(a,b){return gained[b]-gained[a];}).map(function(k){return esc(k)+' +'+gained[k];}).join(" · ");
    return '<div class="panel board tour"><div class="plbl">🏆 Tournoi du trajet · manche '+T.log.length+'</div>'+
      (gl?'<p class="hint" style="margin:0 0 4px">'+gl+'</p>':'')+tourBoard(T,false)+'</div>';
  }

  var devCats=null, HINT_AT=[300,420,540];
  function devPool(){

  function devNext(avoid){
    var pool=devPool(),all=loadSeen(),seen=all.devine||[];
    var un=pool.filter(function(d){return seen.indexOf(d[0])<0&&d[0]!==avoid;});
    if(!un.length){seen=[];un=pool.filter(function(d){return d[0]!==avoid;});if(!un.length)un=pool;}
    var d=un[Math.floor(Math.random()*un.length)];
    seen.push(d[0]);all.devine=seen;saveSeen(all);
    return d;

    var guessers=[];

    var ch=devNext(), gi=0, nq=0, hints=0, secs=0, peek=false;

    function paintTop(){

    function showHint(auto){

      el("dhints").innerHTML=hintBox();el("dhints").hidden=false;

    function paintAsker(){el("dask").textContent=asker();}
    function play(){
      P.innerHTML='<div class="banner"><span class="em">❓</span><div><div class="lbl">Pose ta question</div><div class="name" id="dask"></div></div></div>'+
        '<div class="dstats"><span id="dtime">0:00</span><span id="dnq">0 question</span></div>'+
        '<div class="body">'+
          '<p class="instr" id="dmsg">'+(named?'<b>'+esc(master)+'</b> garde le téléphone et répond. ':'')+'<b>Oui</b> : la même personne rejoue. <b>Non</b> : au suivant.</p>'+
          '<div class="hints" id="dhints" hidden></div>'+
          '<p class="hint" id="dnext"></p>'+
          '<div class="peek" id="dpeek" hidden></div>'+
        '</div>'+
        '<div class="foot">'+
          '<div class="row2"><button class="btn yes" id="dyes">✅ Oui</button><button class="btn no" id="dno">❌ Non</button></div>'+
          '<button class="btn ghost sm" id="dunk">🤷 Je ne sais pas / ça dépend</button>'+
          '<button class="btn found" id="dfound">🎉 Trouvé !</button>'+
          '<div class="row2"><button class="btn ghost sm" id="dhint">💡 Indice</button><button class="btn ghost sm" id="dpeekb">👁 Revoir</button></div>'+
          '<button class="linkbtn" id="dgive">On abandonne → révéler</button>'+
        '</div>';
      if(hints){el("dhints").innerHTML=hintBox();el("dhints").hidden=false;if(hints>=3)el("dhint").disabled=true;}
      paintAsker();paintTop();
      clearT();
      timer=setInterval(function(){
        secs++;
        if(hints<3&&secs>=HINT_AT[hints])showHint(true);
        paintTop();
      },1000);
      el("dyes").addEventListener("click",function(){nq++;paintTop();el("dmsg").innerHTML='<b>Oui !</b> '+esc(asker())+' repose une question.';});
      el("dno").addEventListener("click",function(){nq++;gi++;paintAsker();paintTop();el("dmsg").innerHTML='<b>Non.</b> Au tour de '+esc(asker())+'.';});
      el("dunk").addEventListener("click",function(){el("dmsg").innerHTML='Pas de réponse claire : '+esc(asker())+' reformule ou pose une autre question.';});
      el("dhint").addEventListener("click",function(){showHint(false);});
      el("dpeekb").addEventListener("click",function(){
        peek=!peek;var b=el("dpeek");
        b.hidden=!peek;b.innerHTML=peek?'<b>'+esc(ch[0])+'</b> · '+DEV_CATS[ch[1]]:'';
        el("dpeekb").textContent=peek?"🙈 Cacher":"👁 Revoir";
      });
      el("dfound").addEventListener("click",found);
      el("dgive").addEventListener("click",function(){clearT();if(named)addPts(master,2);result(null,0);});
    }
    function found(){
      clearT();
      var pts=Math.max(1,3-hints);
      if(!named){result("",pts);return;}
      P.innerHTML='<div class="body"><div class="chip"><span class="dot"></span>Bravo !</div>'+
        '<h2 class="qtext">Qui a trouvé ?</h2><p class="instr">'+pts+' point'+(pts>1?'s':'')+' pour la bonne réponse ('+(hints?hints+' indice'+(hints>1?'s':'')+' donné'+(hints>1?'s':''):'sans indice')+').</p>'+
        '<div class="chips pick">'+guessers.map(function(g,i){return '<button class="pchip" data-i="'+i+'">'+esc(g)+'</button>';}).join("")+'</div></div>'+
        '<div class="foot"><button class="linkbtn" id="dback">← Fausse alerte, on reprend</button></div>';
      Array.prototype.forEach.call(P.querySelectorAll(".pick button"),function(b){
        b.addEventListener("click",function(){var w=guessers[+b.getAttribute("data-i")];addPts(w,pts);result(w,pts);});
      });

    function result(who,pts){

        '<p class="instr">'+mmss(secs)+' · '+nq+' question'+(nq>1?'s':'')+' · '+hints+' indice'+(hints>1?'s':'')+'</p>'+
        (who===null?(named?'<p class="instr"><b>'+esc(master)+'</b> gagne 2 points pour avoir tenu bon.</p>':''):(who?'<p class="instr"><b>'+esc(who)+'</b> marque '+pts+' point'+(pts>1?'s':'')+'.</p>':'<p class="instr">'+pts+' point'+(pts>1?'s':'')+' pour la table.</p>'))+
        boardHTML()+
      '</div>'+
      '<div class="foot"><button class="btn" id="dnextr">Manche suivante →</button><button class="linkbtn" id="dquit">Terminer la partie</button></div>';
      el("dnextr").addEventListener("click",function(){idx++;renderRound();});
      el("dquit").addEventListener("click",quitQuiz);

  /* ---------------- LA LISTE ---------------- */
  var lTeams=2, lDur=60;
  function teamName(i){return "Équipe "+(i+1);}
  /* ---------------- MICRO (reconnaissance vocale du navigateur) ---------------- */
  var REC=window.SpeechRecognition||window.webkitSpeechRecognition||null;
  var lMic=!!REC, micObj=null, micOn=false;
  function normTxt(t){
    return " "+String(t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/œ/g,"oe").replace(/æ/g,"ae")
      .replace(/[^a-z0-9]+/g," ").split(" ").filter(Boolean).map(function(w){return w.length>3?w.replace(/(s|x)$/,""):w;}).join(" ")+" ";
  }
  function itemKeys(t){
    var keys=[],main=t.replace(/\(.*?\)/g,"").trim(),par=(t.match(/\(([^)]*)\)/)||[])[1];
    keys.push(normTxt(main));
    if(par)keys.push(normTxt(par));
    var m=normTxt(main).replace(/^ (le|la|les|l|un|une|des) /," ");if(keys.indexOf(m)<0)keys.push(m);
    var ws=normTxt(main).trim().split(" ");
    if(ws.length>1&&ws[ws.length-1].length>=5)keys.push(" "+ws[ws.length-1]+" ");
    return keys.filter(function(k){return k.trim().length>=2;});
  }
  function micStart(onText){
    if(!REC)return false;
    micStop();
    try{
      var r=new REC();r.lang="fr-FR";r.continuous=true;r.interimResults=true;r.maxAlternatives=3;
      r.onresult=function(e){
        var txt="";
        for(var i=e.resultIndex;i<e.results.length;i++){for(var a=0;a<e.results[i].length;a++)txt+=" "+e.results[i][a].transcript;}
        onText(txt,e.results[e.results.length-1][0].transcript);
      };
      r.onerror=function(e){if(e.error==="not-allowed"||e.error==="service-not-allowed"){micOn=false;onText(null,"⚠️ Micro refusé : autorise-le dans les réglages du navigateur, ou coche à la main.");}};
      r.onend=function(){if(micOn&&micObj===r){try{r.start();}catch(e){}}};
      micObj=r;micOn=true;r.start();return true;
    }catch(e){micOn=false;return false;}
  }
  function micStop(){micOn=false;if(micObj){try{micObj.abort();}catch(e){}micObj=null;}}

  function renderListe(P){
    var team=teamName(idx%lTeams);
    var cat=deck[idx%deck.length];
    /* 10 réponses maximum : 7 classiques + 3 difficiles (complété si une liste est plus courte) */
    /* les classiques sont tirées parmi les 12 premières de la liste (les plus évidentes), pour que les réponses qui viennent en premier comptent */
    /* les 5 premières de chaque liste (les incontournables) sont toujours dans les 10, le reste est tiré au sort */
    var aa=cat.a.split("|"),ea=aa.slice(0,5).concat(shuffle(aa.slice(5,15)),shuffle(aa.slice(15))),eh=shuffle(cat.h?cat.h.split("|"):[]);
    var nh=Math.min(3,eh.length),na=Math.min(10-nh,ea.length);
    if(na+nh<10)nh=Math.min(eh.length,10-na);
    var items=ea.slice(0,na).map(function(x){return{t:x,p:1};}).concat(eh.slice(0,nh).map(function(x){return{t:x,p:2};}));
    items.sort(function(a,b){return a.t.localeCompare(b.t,"fr");});
    /* toutes les autres bonnes réponses de la liste comptent aussi (bonus hors des 10) */
    var main=items.length,inMain=items.map(function(it){return it.t;});
    aa.forEach(function(x){if(inMain.indexOf(x)<0)items.push({t:x,p:1,x:true});});
    (cat.h?cat.h.split("|"):[]).forEach(function(x){if(inMain.indexOf(x)<0)items.push({t:x,p:2,x:true});});
    var got={},extra=0,left=lDur,running=false;
    function score(){var s=extra;for(var k in got)if(got[k])s+=items[k].p;return s;}
    function count(){var n=extra;for(var k in got)if(got[k])n++;return n;}
    function mainCount(){var n=0;for(var k=0;k<main;k++)if(got[k])n++;return n;}
    function bonusCount(){return count()-mainCount();}
    function foundTxt(){var b=bonusCount();return mainCount()+" / "+main+(b?" · +"+b:"");}
    function bonusChip(i,cls){var it=items[i];return '<button class="lchip sm'+(it.p>1?' hard':'')+(cls||'')+'" data-i="'+i+'">'+(it.p>1?'⭐ ':'')+esc(it.t)+'</button>';}

    function hand(){
      clearT();
      P.innerHTML='<div class="banner"><span class="em">'+G.em+'</span><div><div class="lbl">Au tour de</div><div class="name">'+team+'</div></div></div>'+
        '<div class="body"><div class="chip"><span class="dot"></span>Manche '+(idx+1)+'</div>'+
        '<h2 class="qtext">Passe le téléphone à l\'arbitre.</h2>'+
        '<p class="instr">Une personne d\'une <b>autre équipe</b>. Elle seule regarde l\'écran et coche les bonnes réponses.</p></div>'+
        '<div class="foot"><button class="btn" id="lsee">Je suis l\'arbitre → voir la catégorie</button><button class="linkbtn" id="lquit">Terminer la partie</button></div>';
      el("lsee").addEventListener("click",ready);
      el("lquit").addEventListener("click",quitQuiz);
    }
    function ready(){
      P.innerHTML='<div class="body"><div class="chip"><span class="dot"></span>'+team+' · '+lDur+' secondes</div>'+
        '<h2 class="qtext">'+esc(cat.c)+'</h2>'+
        '<p class="instr">Lis la catégorie à voix haute. Au top, '+team+' cite un maximum de réponses. Toutes les bonnes réponses comptent (<b>'+items.length+'</b> possibles) : 1 point chacune, 2 pour les <b>⭐ difficiles</b>.'+(items.length>main?' L\'écran en montre <b>'+main+' en grand</b> pour cocher vite ; les autres s\'ajoutent en bonus (micro, ou à la main à la fin).':'')+'</p>'+
        (REC?'<div class="ambiance"><div class="lbl">Micro</div><div class="seg two" id="lmic"><button data-m="1"'+(lMic?' class="on"':'')+'>🎙️ Activé<span class="s">coche tout seul</span></button><button data-m="0"'+(lMic?'':' class="on"')+'>✋ Désactivé<span class="s">à la main</span></button></div></div>'+
          '<p class="hint">Le téléphone écoute les réponses et les coche tout seul. Tu peux toujours cocher ou décocher à la main.</p>':
          '<p class="hint">Ce navigateur ne permet pas la reconnaissance vocale : on coche à la main.</p>')+'</div>'+
        '<div class="foot"><button class="btn" id="lgo">▶️ Top chrono</button><button class="linkbtn" id="lother">Autre catégorie</button></div>';
      el("lgo").addEventListener("click",run);
      if(el("lmic"))Array.prototype.forEach.call(el("lmic").querySelectorAll("button"),function(b){
        b.addEventListener("click",function(){lMic=b.getAttribute("data-m")==="1";Array.prototype.forEach.call(el("lmic").querySelectorAll("button"),function(x){x.classList.toggle("on",x===b);});});
      });
      el("lother").addEventListener("click",function(){
        var spare=LISTES.filter(function(x){return deck.indexOf(x)<0;});
        var pool=spare.length?spare:LISTES.filter(function(x){return x!==cat;});
        deck[idx%deck.length]=pool[Math.floor(Math.random()*pool.length)];
        renderRound();
      });
    }
    function paint(){
      el("ltime").textContent=left;
      el("lscore").textContent=score()+" pt"+(score()>1?"s":"");
      el("lfound").textContent=foundTxt();
      el("lbar").style.width=(100*left/lDur)+"%";
      el("ltime").parentNode.classList.toggle("hurry",left<=10);
    }
    function run(){
      running=true;
      P.innerHTML='<div class="lhead"><div class="lcat">'+esc(cat.c)+'</div><div class="lnums"><span class="lt"><span id="ltime"></span> s</span><span id="lfound"></span><span id="lscore"></span></div><div class="lbarw"><div class="lbar" id="lbar"></div></div></div>'+
        '<div class="lgrid ten" id="lgrid">'+items.slice(0,main).map(function(it,i){return '<button class="lchip'+(it.p>1?' hard':'')+'" data-i="'+i+'">'+(it.p>1?'⭐ ':'')+esc(it.t)+'</button>';}).join("")+'</div>'+
        '<div class="lbonus" id="lbonus" hidden><div class="lbl">Bonus hors des '+main+'</div><div class="lbx" id="lbx"></div></div>'+
        '<div class="foot lfoot"><p class="heard" id="lheard" hidden></p><button class="btn sm" id="lstop">⏹ Stop</button></div>';
      Array.prototype.forEach.call(P.querySelectorAll("#lgrid .lchip"),function(b){
        b.addEventListener("click",function(){var i=+b.getAttribute("data-i");got[i]=!got[i];b.classList.toggle("on",!!got[i]);paint();if(count()>=items.length)setTimeout(done,600);});
      });
      function addBonus(i){
        var z=el("lbonus");z.hidden=false;
        el("lbx").insertAdjacentHTML("beforeend",bonusChip(i," on pop"));
        var b=el("lbx").lastChild;
        b.addEventListener("click",function(){got[i]=false;b.parentNode.removeChild(b);if(!el("lbx").children.length)z.hidden=true;paint();});
      }
      if(lMic&&REC){
        var keys=items.map(function(it){return itemKeys(it.t);});
        var kc={};keys.forEach(function(ks){ks.forEach(function(k){kc[k]=(kc[k]||0)+1;});});
        keys=keys.map(function(ks,i){var f=ks.filter(function(k){return kc[k]===1;});return f.length?f:ks.slice(0,1);});
        var ok=micStart(function(txt,last){
          if(!running)return;
          var h=el("lheard");h.hidden=false;
          if(txt===null){h.textContent=last;return;}
          h.textContent="🎙️ « "+last.trim()+" »";
          var n=normTxt(txt);
          keys.forEach(function(ks,i){
            if(got[i])return;
            for(var k=0;k<ks.length;k++){if(n.indexOf(ks[k])>=0){
              got[i]=true;
              if(i>=main){addBonus(i);}else{var b=P.querySelector('#lgrid .lchip[data-i="'+i+'"]');
              if(b){b.classList.add("on","pop");(function(bb){setTimeout(function(){bb.classList.remove("pop");},500);})(b);}}
              paint();if(count()>=items.length)setTimeout(done,600);break;}}
          });
        });
        if(ok){var h0=el("lheard");h0.hidden=false;h0.textContent="🎙️ J'écoute…";}
      }
      el("lstop").addEventListener("click",done);
      paint();
      countIn(function(){
        timer=setInterval(function(){left--;tickFx(left,P.querySelector(".lnums"));if(left<=0){left=0;paint();done();return;}paint();},1000);
      });
    }
    function done(){
      if(!running)return;running=false;clearT();
      try{if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(e){}
      micStop();
      try{say("Temps écoulé !");}catch(e){}
      function sumHTML(){var s=score();return team+' : '+s+' point'+(s>1?'s':'')+' · '+foundTxt();}
      P.innerHTML='<div class="body">'+
        '<div class="chip"><span class="dot"></span>Temps écoulé · vérification</div>'+
        '<h2 class="qtext sm" id="lsum">'+sumHTML()+'</h2>'+
        '<p class="instr">Une réponse <b>oubliée</b> ou <b>mal entendue</b> ? L\'arbitre la touche pour la cocher (ou la décocher). Les réponses en pointillé n\'ont pas été trouvées.</p>'+
        '<div class="lgrid ten" id="lfix">'+items.slice(0,main).map(function(it,i){return '<button class="lchip'+(it.p>1?' hard':'')+(got[i]?' on':' miss')+'" data-i="'+i+'">'+(it.p>1?'⭐ ':'')+esc(it.t)+'</button>';}).join("")+'</div>'+
        (items.length>main?'<div class="lbonus"><div class="lbl">Bonus hors des '+main+' · touche pour ajouter ou retirer</div><div class="lbx" id="lbfix">'+
          items.map(function(it,i){return i<main||!got[i]?'':bonusChip(i," on");}).join("")+'</div>'+
          '<details class="missed" id="lmore"><summary>➕ Ajouter une autre bonne réponse ('+(items.length-main)+' possibles)</summary><div class="lbx">'+
          items.map(function(it,i){return i<main||got[i]?'':bonusChip(i," miss");}).join("")+'</div></details></div>':'')+
        (Object.keys(qScores).length?'<p class="hint">Classement avant cette manche :</p>'+boardHTML():'')+
      '</div>'+
      '<div class="foot"><button class="btn" id="lnext">Valider → au tour de '+teamName((idx+1)%lTeams)+'</button><button class="linkbtn" id="lquit">Valider et terminer la partie</button></div>';
      Array.prototype.forEach.call(P.querySelectorAll(".lbonus .lchip"),function(b){
        b.addEventListener("click",function(){var i=+b.getAttribute("data-i");got[i]=!got[i];b.classList.toggle("on",!!got[i]);b.classList.toggle("miss",!got[i]);el("lsum").textContent=sumHTML();});
      });
      Array.prototype.forEach.call(P.querySelectorAll("#lfix .lchip"),function(b){
        b.addEventListener("click",function(){var i=+b.getAttribute("data-i");got[i]=!got[i];b.classList.toggle("on",!!got[i]);b.classList.toggle("miss",!got[i]);el("lsum").textContent=sumHTML();});
      });
      var saved=false;
      function commit(){if(!saved){saved=true;addPts(team,score());}}
      el("lnext").addEventListener("click",function(){commit();idx++;renderRound();});
      el("lquit").addEventListener("click",function(){commit();quitQuiz();});
    }
    hand();
  }

  /* ---------------- QUIZ : pavé de points ---------------- */
  var padHist=[];
  function padHTML(lbl){
    if(players.length<2)return "";
    return '<div class="panel pad"><div class="plbl">'+(lbl||"Qui a marqué ? Touche pour +1")+'</div><div class="chips pick">'+
      players.map(function(p,i){return '<button class="pchip" data-i="'+i+'">'+esc(p)+' <span class="pp">'+(qScores[p]||0)+'</span></button>';}).join("")+
      '</div><button class="linkbtn" id="padundo">Annuler le dernier point</button></div>';
  }
  function wirePad(P,step){
    step=step||1;
    var bs=P.querySelectorAll(".pad .pchip");
    function refresh(){Array.prototype.forEach.call(bs,function(b){b.querySelector(".pp").textContent=qScores[players[+b.getAttribute("data-i")]]||0;});}
    Array.prototype.forEach.call(bs,function(b){
      b.addEventListener("click",function(){var p=players[+b.getAttribute("data-i")];addPts(p,step);padHist.push([p,step]);refresh();b.classList.add("on");setTimeout(function(){b.classList.remove("on");},250);});
    });
    var u=el("padundo");
    if(u)u.addEventListener("click",function(){var h=padHist.pop();if(h){addPts(h[0],-h[1]);refresh();}});
  }
  function nextOrEnd(){if(idx+1>=deck.length){quitQuiz();return;}idx++;renderRound();}
  function freshAll(id,arr){return freshFirst(id,shuffle(arr),arr.length);}

  /* ---------------- PETIT BAC ---------------- */
  var bDur=90, bLast=[];
  function renderBac(P){
    var L,cats;
    function draw(){
      var pool=BAC_LETTRES.filter(function(x){return bLast.indexOf(x)<0;});
      L=pool[Math.floor(Math.random()*pool.length)];
      bLast.push(L);if(bLast.length>6)bLast.shift();

  var tTeams=2, tDur=60, tPos=0;
  function renderTaboo(P){
    var team=teamName(idx%tTeams), pts=0, found=0, left=tDur, running=false, card;
    function pick(){card=deck[tPos%deck.length].split("|");tPos++;}
    function hand(){
      clearT();
      P.innerHTML='<div class="banner"><span class="em">'+G.em+'</span><div><div class="lbl">Au tour de</div><div class="name">'+team+'</div></div></div>'+
        '<div class="body"><div class="chip"><span class="dot"></span>Manche '+(idx+1)+' · '+tDur+' s</div>'+
        '<h2 class="qtext">Qui fait deviner ?</h2>'+
        '<p class="instr">Une personne de '+team+' prend le téléphone et fait deviner un maximum de mots à son équipe, <b>sans dire le mot ni les mots interdits</b>. Un adversaire regarde l\'écran par-dessus son épaule pour surveiller.</p></div>'+
        '<div class="foot"><button class="btn" id="tgo2">▶️ C\'est parti</button><button class="linkbtn" id="tquit">Terminer la partie</button></div>';
      el("tgo2").addEventListener("click",run);
      el("tquit").addEventListener("click",quitQuiz);
    }
    function paintCard(){
      el("tword").textContent=card[0];
      el("tban").innerHTML=card.slice(1).map(function(w){return '<span>'+esc(w)+'</span>';}).join("");
    }
    function paint(){
      el("ltime").textContent=left;
      el("lscore").textContent=pts+" pt"+(Math.abs(pts)>1?"s":"");
      el("lbar").style.width=(100*left/tDur)+"%";
      el("ltime").parentNode.classList.toggle("hurry",left<=10);
    }
    function run(){
      running=true;pick();
      P.innerHTML='<div class="lhead"><div class="lcat">'+team+'</div><div class="lnums"><span class="lt"><span id="ltime"></span> s</span><span id="lscore"></span></div><div class="lbarw"><div class="lbar" id="lbar"></div></div></div>'+
        '<div class="body"><div class="tcard"><div class="tword" id="tword"></div><div class="tlbl">Interdit de dire</div><div class="tban" id="tban"></div></div></div>'+
        '<div class="foot"><div class="row2"><button class="btn yes" id="tok">✅ Trouvé</button><button class="btn ghost" id="tpass">⏭ Passer</button></div><button class="btn no sm" id="tbad">🚫 Mot interdit dit (−1)</button></div>';
      paintCard();paint();
      el("tok").addEventListener("click",function(){pts++;found++;pick();paintCard();paint();});
      el("tpass").addEventListener("click",function(){pick();paintCard();});
      el("tbad").addEventListener("click",function(){pts--;pick();paintCard();paint();});
      countIn(function(){
        timer=setInterval(function(){left--;tickFx(left,P.querySelector(".lnums"));if(left<=0){left=0;paint();done();return;}paint();},1000);
      });
    }
    function done(){
      if(!running)return;running=false;clearT();
      try{if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(e){}
      try{say("Temps écoulé !");}catch(e){}
      addPts(team,pts);
      P.innerHTML='<div class="body"><div class="chip"><span class="dot"></span>Temps écoulé</div>'+
        '<h2 class="qtext">'+team+' : '+pts+' point'+(Math.abs(pts)>1?'s':'')+'</h2>'+
        '<p class="instr">'+found+' mot'+(found>1?'s':'')+' trouvé'+(found>1?'s':'')+'. Le dernier mot était « '+esc(card[0])+' ».</p>'+boardHTML()+'</div>'+
        '<div class="foot"><button class="btn" id="tnext">Au tour de '+teamName((idx+1)%tTeams)+' →</button><button class="linkbtn" id="tquit">Terminer la partie</button></div>';
      el("tnext").addEventListener("click",function(){idx++;renderRound();});
      el("tquit").addEventListener("click",quitQuiz);
    }
    hand();
  }

    var a=CHANSONS.map(function(x,i){return {q:songQuery(x),a:null,k:"🎵 Musique",fr:CH_INTL.indexOf(i)<0,y:CH_Y[i]||0};})
      .concat(CHANSONS2.map(function(x){var p=x.split("|");return {q:songQuery(p[0]+"|"+p[1]),a:null,k:"🎵 Musique",fr:p[3]==="fr",y:+p[2]};}));
    return a.filter(function(o){return c==="fr"?o.fr:c==="intl"?!o.fr:c==="recent"?o.y>=2014:true;});
  }
  function btPool(c){
    var mus=songPool("mix");
    var fil=BT_FILMS.map(function(x){var p=x.split("|");return {q:p[0],a:p[1],k:"🎬 Film"};});
    var ser=BT_SERIES.map(function(x){var p=x.split("|");return {q:p[0],a:p[1],k:"📺 Série"};});
    return c==="musique"?mus:c==="films"?fil:c==="series"?ser:mus.concat(fil,ser);
  }
  /* ---------------- EXTRAITS MUSICAUX (aperçus officiels de 30 s : Deezer, sinon Apple) ---------------- */
  var bAudio=null, jsonpN=0, aTimer=null;
  function stopAudio(){if(aTimer){clearInterval(aTimer);aTimer=null;}if(bAudio){try{bAudio.pause();}catch(e){}}}
  function jsonp(url,cbName,done){
    var name="__cart_cb"+(++jsonpN),sc=document.createElement("script"),fin=false;
    var to=setTimeout(function(){if(fin)return;fin=true;cleanup();done(null);},7000);
    function cleanup(){try{delete window[name];}catch(e){window[name]=undefined;}if(sc.parentNode)sc.parentNode.removeChild(sc);}
    window[name]=function(d){if(fin)return;fin=true;clearTimeout(to);cleanup();done(d);};
    sc.onerror=function(){if(fin)return;fin=true;clearTimeout(to);cleanup();done(null);};
    sc.src=url+(url.indexOf("?")<0?"?":"&")+cbName+"="+name;
    document.head.appendChild(sc);
  }
  function songQuery(s){var p=s.split("|"),art=p[1]||"";if(/^(Chant|Hymne|Générique|Roméo|Notre-Dame|La Reine|Le Roi|Le Livre|La Petite|Aladdin)/.test(art))art="";return (p[0].replace(/[…!?]/g," ")+" "+art).trim();}
  function fetchPreview(item,cb){
    var q=encodeURIComponent(item.q);
    jsonp("https://api.deezer.com/search?q="+q+"&limit=5&output=jsonp","callback",function(d){
      var t=d&&d.data&&d.data.filter(function(x){return x.preview;})[0];
      if(t)return cb({url:t.preview,title:t.title,artist:t.artist&&t.artist.name,cover:t.album&&t.album.cover_medium,src:"Deezer"});
      jsonp("https://itunes.apple.com/search?term="+q+"&media=music&entity=song&limit=5&country=fr","callback",function(d2){
        var r=d2&&d2.results&&d2.results.filter(function(x){return x.previewUrl;})[0];
        if(r)return cb({url:r.previewUrl,title:r.trackName,artist:r.artistName,cover:r.artworkUrl100,src:"Apple Music"});
        cb(null);
      });
    });
  }
  function getAudio(){if(!bAudio){bAudio=new Audio();bAudio.preload="auto";}return bAudio;}
  function songCardHTML(t){return (t.a?'<div class="answer"><div class="as">'+t.k+'</div><div class="aw">'+esc(t.a)+'</div></div>':'')+'<div class="songcard">'+(t.cover?'<img src="'+esc(t.cover)+'" alt="">':'')+'<div><div class="st">'+esc(t.title)+'</div><div class="sa">'+esc(t.artist||"")+'</div></div></div>';}
  function loadingHTML(msg){return '<div class="body"><div class="chip"><span class="dot"></span>Chargement</div><h2 class="qtext sm">'+msg+'</h2><p class="instr">Il faut une connexion internet pour les extraits.</p></div>';}
  function audioFailHTML(){return '<div class="body"><div class="chip"><span class="dot"></span>Pas d\'extrait</div><h2 class="qtext sm">Impossible de charger la musique.</h2><p class="instr">Vérifie la connexion internet, puis réessaie.</p></div>'+
    '<div class="foot"><button class="btn" id="aretry">🔄 Réessayer avec une autre chanson</button><button class="linkbtn" id="aquit">Terminer la partie</button></div>';}
  var aPos=0;
  function nextSong(){var s=deck[aPos%deck.length];aPos++;return s;}

  /* ---------------- BLIND TEST ---------------- */
  function renderBlindtest(P){
    var track=null;
    function load(){
      stopAudio();P.innerHTML=loadingHTML("On cherche le prochain extrait…");
      var cur0=nextSong();
      fetchPreview(cur0,function(t){
        if(!t){P.innerHTML=audioFailHTML();el("aretry").addEventListener("click",load);el("aquit").addEventListener("click",quitQuiz);return;}
        t.a=cur0.a;t.k=cur0.k;track=t;var a=getAudio();a.src=t.url;try{a.load();}catch(e){}
        ready();
      });
    }
    function cur0k(){return track.k||"🎵 Musique";}
    function ready(){
      P.innerHTML='<div class="body"><div class="chip"><span class="dot"></span>Extrait '+(idx+1)+'</div>'+
        '<div class="disc" id="disc">🎧</div>'+
        '<p class="instr"><b>'+cur0k()+'</b> · Monte le son. '+(track.a?'Dès que tu reconnais, crie <b>le titre du film ou de la série</b> (1 point, 2 si tu trouves aussi le compositeur ou l\'interprète).':'Dès que tu reconnais, crie le <b>titre</b> (1 point) et l\'<b>artiste</b> (1 point de plus).')+'</p></div>'+
        '<div class="foot"><button class="btn" id="bplay">▶️ Lancer l\'extrait</button><button class="linkbtn" id="bskip">Passer cette chanson</button></div>';
      el("bplay").addEventListener("click",play);
      el("bskip").addEventListener("click",load);
    }
    function play(){
      var a=getAudio();a.currentTime=0;
      var p=a.play();if(p&&p.catch)p.catch(function(){});
      P.innerHTML='<div class="body"><div class="chip"><span class="dot"></span>Écoutez !</div>'+
        '<div class="disc spin">🎧</div><div class="lbarw"><div class="lbar" id="abar"></div></div>'+
        '<p class="instr">Quelqu\'un a trouvé ? Touche « Stop ».</p></div>'+
        '<div class="foot"><button class="btn found" id="bstop">✋ Stop, on a une réponse !</button><button class="btn ghost sm" id="breveal">Personne ne trouve → révéler</button></div>';
      aTimer=setInterval(function(){var d=a.duration||30;el("abar").style.width=Math.min(100,100*a.currentTime/d)+"%";if(a.ended){stopAudio();reveal(false);}},250);
      el("bstop").addEventListener("click",function(){stopAudio();reveal(true);});
      el("breveal").addEventListener("click",function(){stopAudio();reveal(false);});
    }
    function reveal(someone){
      P.innerHTML='<div class="body"><div class="chip"><span class="dot"></span>'+(someone?'Alors, c\'était…':'C\'était…')+'</div>'+songCardHTML(track)+
        padHTML(track.a?"Qui a trouvé ? +1 le titre, +1 le bonus":"Qui a trouvé ? +1 le titre, +1 l'artiste")+'<p class="credit">Extrait fourni par '+track.src+'</p></div>'+
        '<div class="foot"><button class="btn ghost sm" id="bagain">🔁 Réécouter</button><button class="btn" id="bnext">Extrait suivant →</button><button class="linkbtn" id="bquit">Terminer la partie</button></div>';
      wirePad(P);
      el("bagain").addEventListener("click",function(){var a=getAudio();if(a.paused){a.play();el("bagain").textContent="⏸ Pause";}else{a.pause();el("bagain").textContent="🔁 Réécouter";}});
      el("bnext").addEventListener("click",function(){stopAudio();idx++;renderRound();});
      el("bquit").addEventListener("click",function(){stopAudio();quitQuiz();});
    }
    load();
  }

  /* ---------------- N'OUBLIEZ PAS LES PAROLES (version maison) ---------------- */
  function renderParoles(P){
    var named=players.length>=2, singer=named?vics[idx%vics.length]:"la personne au micro", track=null, cut=0;
    function newCut(){var d=(getAudio().duration&&isFinite(getAudio().duration))?getAudio().duration:30;cut=Math.round((10+Math.random()*Math.max(4,d-20))*10)/10;}
    function load(){
      stopAudio();P.innerHTML=loadingHTML("On cherche la chanson de "+esc(singer)+"…");
      fetchPreview(nextSong(),function(t){
        if(!t){P.innerHTML=audioFailHTML();el("aretry").addEventListener("click",load);el("aquit").addEventListener("click",quitQuiz);return;}
        track=t;var a=getAudio();a.src=t.url;try{a.load();}catch(e){}
        newCut();ready();
      });
    }
    function ready(){
      P.innerHTML='<div class="banner"><span class="em">🎤</span><div><div class="lbl">Au micro</div><div class="name">'+esc(singer)+'</div></div></div>'+
        '<div class="body">'+songCardHTML(track)+
        '<p class="instr">La musique va <b>s\'arrêter d\'un coup</b>. '+esc(singer)+' doit continuer à chanter les paroles, seul·e, sans musique. Ensuite, on relance pour vérifier.</p></div>'+
        '<div class="foot"><button class="btn" id="pplay">▶️ Lancer la musique</button><button class="linkbtn" id="pskip">Je ne connais pas cette chanson → une autre</button></div>';
      el("pplay").addEventListener("click",listen);
      el("pskip").addEventListener("click",load);
    }
    function listen(){
      var a=getAudio();a.currentTime=0;var p=a.play();if(p&&p.catch)p.catch(function(){});
      P.innerHTML='<div class="body"><div class="chip"><span class="dot"></span>Écoute bien…</div>'+songCardHTML(track)+'<div class="disc spin">🎵</div><div class="lbarw"><div class="lbar" id="abar"></div></div></div>'+
        '<div class="foot"><p class="instr">La musique va s\'arrêter toute seule.</p></div>';
      aTimer=setInterval(function(){
        el("abar").style.width=Math.min(100,100*a.currentTime/cut)+"%";
        if(a.currentTime>=cut||a.ended){stopAudio();sing();}
      },100);
    }
    function sing(){
      P.innerHTML='<div class="banner"><span class="em">🎤</span><div><div class="lbl">À toi de chanter</div><div class="name">'+esc(singer)+'</div></div></div>'+
        '<div class="body"><div class="disc">🤫</div><h2 class="qtext sm">Continue les paroles !</h2><p class="instr">Une ou deux phrases, sans la musique. Puis on vérifie.</p></div>'+
        '<div class="foot"><button class="btn" id="pcheck">▶️ Vérifier (la musique reprend)</button><button class="btn ghost sm" id="precut">Pas de paroles à cet endroit → couper ailleurs</button></div>';
      el("pcheck").addEventListener("click",check);
      el("precut").addEventListener("click",function(){newCut();listen();});
    }
    function check(){
      var a=getAudio();a.currentTime=cut;var p=a.play();if(p&&p.catch)p.catch(function(){});
      var end=cut+9;
      aTimer=setInterval(function(){if(a.currentTime>=end||a.ended){stopAudio();}},150);
      P.innerHTML='<div class="body"><div class="chip"><span class="dot"></span>Vérification</div>'+songCardHTML(track)+'<div class="disc spin">🎵</div>'+
        '<p class="instr">C\'étaient bien ces paroles-là ?</p><p class="credit">Extrait fourni par '+track.src+'</p></div>'+
        '<div class="foot"><div class="row2"><button class="btn yes" id="pok">✅ Réussi</button><button class="btn no" id="pko">❌ Raté</button></div><button class="btn ghost sm" id="pagain">🔁 Réécouter ce passage</button></div>';
      el("pagain").addEventListener("click",function(){stopAudio();check();});
      el("pok").addEventListener("click",function(){stopAudio();if(named)addPts(singer,2);result(true);});
      el("pko").addEventListener("click",function(){stopAudio();result(false);});
    }
    function result(ok){
      P.innerHTML='<div class="body"><div class="chip"><span class="dot"></span>'+(ok?'Bravo !':'Raté…')+'</div>'+songCardHTML(track)+
        (named?'<p class="instr">'+(ok?'<b>'+esc(singer)+'</b> marque 2 points.':'Pas de point cette fois.')+'</p>':'')+boardHTML()+'</div>'+
        '<div class="foot"><button class="btn" id="pnext">Chanson suivante →</button><button class="linkbtn" id="pquit">Terminer la partie</button></div>';
      el("pnext").addEventListener("click",function(){idx++;renderRound();});
      el("pquit").addEventListener("click",quitQuiz);
    }
    load();
  }

  /* ---------------- OÙ SUIS-JE ? ---------------- */
  var ouCat="mix";
  function ouPool(c){return LIEUX.filter(function(l){return c==="mix"||l[1]===c;});}
  function renderOusuisje(P){
    var named=players.length>=2, reader=named?vics[idx%vics.length]:"le lecteur", L=deck[idx%deck.length], shown=1;
    function paint(){
      var clues=L.slice(2,2+shown).map(function(c,i){return '<p><b>Indice '+(i+1)+'</b> '+esc(c)+'</p>';}).join("");
      P.innerHTML='<div class="banner"><span class="em">🗺️</span><div><div class="lbl">'+(named?'Lit les indices':'Lieu mystère')+'</div><div class="name">'+esc(reader)+'</div></div></div>'+
        '<div class="body"><div class="chip"><span class="dot"></span>'+(L[1]==="france"?'🇫🇷 En France':'🌍 Dans le monde')+' · '+(6-shown)+' point'+(6-shown>1?'s':'')+' en jeu</div>'+
        '<h2 class="qtext sm">Où suis-je ?</h2><div class="hints">'+clues+'</div>'+
        '<p class="instr">'+(named?esc(reader)+' lit l\'indice à voix haute (et ne joue pas cette manche). ':'')+'Le premier qui trouve gagne. Moins il y a d\'indices, plus ça rapporte.</p>'+
        '<div class="peek" id="opeek" hidden></div></div>'+
        '<div class="foot">'+(shown<5?'<button class="btn" id="onext">💡 Indice suivant</button>':'')+
        '<div class="row2"><button class="btn found" id="ofound">🎉 Trouvé !</button><button class="btn ghost" id="ogive">Révéler</button></div>'+
        '<button class="linkbtn" id="opeekb">👁 Voir la réponse (lecteur seulement)</button>'+
        '<button class="linkbtn" id="oquit">Terminer la partie</button></div>';
      el("opeekb").addEventListener("click",function(){var pk=el("opeek");pk.hidden=!pk.hidden;pk.innerHTML=pk.hidden?'':'<b>'+esc(L[0])+'</b>';el("opeekb").textContent=pk.hidden?"👁 Voir la réponse (lecteur seulement)":"🙈 Cacher la réponse";});
      var n=el("onext");if(n)n.addEventListener("click",function(){shown++;paint();});
      el("ofound").addEventListener("click",found);
      el("ogive").addEventListener("click",function(){result(null,0);});
      el("oquit").addEventListener("click",quitQuiz);
    }
    function found(){
      var pts=6-shown;
      if(!named){result("",pts);return;}
      var others=players.filter(function(p){return p!==reader;});
      P.innerHTML='<div class="body"><div class="chip"><span class="dot"></span>Bravo !</div><h2 class="qtext">'+esc(L[0])+'</h2><h2 class="qtext sm">Qui a trouvé ?</h2>'+
        '<p class="instr">'+pts+' point'+(pts>1?'s':'')+' ('+shown+' indice'+(shown>1?'s':'')+')</p>'+
        '<div class="chips pick">'+others.map(function(g,i){return '<button class="pchip" data-i="'+i+'">'+esc(g)+'</button>';}).join("")+'</div></div>'+
        '<div class="foot"><button class="linkbtn" id="oback">← Fausse alerte</button></div>';
      Array.prototype.forEach.call(P.querySelectorAll(".pick button"),function(b){
        b.addEventListener("click",function(){var w=others[+b.getAttribute("data-i")];addPts(w,pts);result(w,pts);});
      });
      el("oback").addEventListener("click",paint);
    }
    function result(w,pts){
      P.innerHTML='<div class="body"><div class="chip"><span class="dot"></span>'+(w===null?'Personne n\'a trouvé':'Trouvé !')+'</div>'+
        '<p class="instr">C\'était…</p><h2 class="qtext">'+esc(L[0])+'</h2>'+
        '<div class="hints">'+L.slice(2).map(function(c,i){return '<p><b>Indice '+(i+1)+'</b> '+esc(c)+'</p>';}).join("")+'</div>'+
        (w?'<p class="instr"><b>'+esc(w)+'</b> marque '+pts+' point'+(pts>1?'s':'')+'.</p>':'')+boardHTML()+'</div>'+
        '<div class="foot"><button class="btn" id="onx">Lieu suivant →</button><button class="linkbtn" id="oquit">Terminer la partie</button></div>';
      el("onx").addEventListener("click",function(){idx++;renderRound();});
      el("oquit").addEventListener("click",quitQuiz);
    }
    paint();
  }

  /* ---------------- C'ÉTAIT MIEUX AVANT ---------------- */
  var avMode="mix";
  function avPool(m){return AVANT.filter(function(x){return m==="mix"||x.indexOf(m+"|")===0;});}
  function renderAvant(P){
    var q=deck[idx%deck.length].split("|"),old=q[0]==="avant";
    P.innerHTML='<div class="body"><div class="chip"><span class="dot"></span>'+(old?'📼 Objet d\'avant':'📱 Mot des jeunes')+'</div>'+
      '<p class="instr">'+(old?'Qu\'est-ce que c\'est ?':'Qu\'est-ce que ça veut dire ?')+'</p>'+
      '<h2 class="qtext'+(old?' sm':'')+'">'+esc(q[1])+'</h2>'+
      '<p class="instr" id="ahelp">'+(old?'Les plus jeunes ont la parole en premier : les anciens n\'aident qu\'au bout de 30 secondes !':'Les plus âgés ont la parole en premier : les jeunes n\'aident qu\'au bout de 30 secondes !')+'</p>'+
      '<div id="aans" hidden><div class="answer"><div class="aw">'+esc(q[2])+'</div><div class="as">'+esc(q[3])+'</div></div>'+padHTML("Qui a trouvé ? Touche pour +1")+'</div></div>'+
      '<div class="foot"><button class="btn" id="ashow">Révéler la réponse</button><button class="btn" id="anext" hidden>Suivant →</button><button class="linkbtn" id="aquit2">Terminer la partie</button></div>';
    el("ashow").addEventListener("click",function(){el("aans").hidden=false;el("ahelp").hidden=true;el("ashow").hidden=true;el("anext").hidden=false;});
    wirePad(P);
    el("anext").addEventListener("click",function(){idx++;renderRound();});
    el("aquit2").addEventListener("click",quitQuiz);
  }

  /* ---------------- L'HISTOIRE À LA CHAÎNE ---------------- */
  var hPos=0, hWords=[], hwPos=0;
  function renderHistoire(P){
    var named=players.length>=2, turn=idx, start=deck[idx%deck.length];
    if(!hWords.length)hWords=shuffle(HIST_MOTS);
    function word(){var w=hWords[hwPos%hWords.length];hwPos++;if(hwPos%hWords.length===0)hWords=shuffle(HIST_MOTS);return w;}
    var cur=word();
    function teller(){return named?players[turn%players.length]:"La personne suivante";}
    function paint(){
      P.innerHTML='<div class="body"><div class="chip"><span class="dot"></span>Histoire '+(idx+1)+'</div>'+
        '<p class="hstart">'+esc(start)+'</p>'+
        '<div class="hturn"><div class="lbl">Au tour de</div><div class="hname">'+esc(teller())+'</div><div class="lbl">Ton mot imposé</div><div class="hword">'+esc(cur)+'</div></div>'+
        '<p class="instr">Continue l\'histoire en une ou deux phrases, en y casant ce mot. Hésitation de plus de cinq secondes : la table peut te huer.</p></div>'+
        '<div class="foot"><button class="btn" id="hnext">Phrase dite → au suivant</button><div class="row2"><button class="btn ghost sm" id="hother">🔄 Autre mot</button><button class="btn ghost sm" id="hnew">📖 Nouvelle histoire</button></div><button class="linkbtn" id="hquit">Terminer la partie</button></div>';
      el("hnext").addEventListener("click",function(){turn++;cur=word();paint();});
      el("hother").addEventListener("click",function(){cur=word();paint();});
      el("hnew").addEventListener("click",function(){idx++;renderRound();});
      el("hquit").addEventListener("click",quitQuiz);
    }
    paint();
  }

  /* ---------------- FIN ---------------- */
  function endGame(){
    clearT();showProg=false;el("progress").hidden=true;
    el("s-end").innerHTML=
      '<div class="em">'+G.em+'</div>'+
      '<h2 class="big">Partie terminée.</h2>'+
      '<p>Fin de cette partie de « '+G.name+' ». '+(G.cat==="quiz"?'Une nouvelle partie remet les scores à zéro.':'Une nouvelle donne pioche d\'autres cartes.')+'</p>'+
      finalHTML+tourAward()+
      '<div class="panel rate">'+
        '<div class="plbl">Ce jeu vous a plu ?</div>'+
        '<div class="row2"><button class="vbtn" data-v="1">👍 On a aimé</button><button class="vbtn" data-v="-1">👎 Bof</button></div>'+
        '<input id="note" maxlength="200" placeholder="Un mot sur ce qui a marché ou pas (facultatif)" autocomplete="off">'+
        '<button class="btn sm" id="sendv" disabled>Enregistrer l\'avis</button>'+
        '<p class="hint" id="vmsg"></p>'+
      '</div>'+
      '<div class="foot"><button class="btn" id="replay">Nouvelle partie</button><button class="btn ghost" id="tohub">← Tous les jeux</button></div>';
    var pick=0;
    Array.prototype.forEach.call(el("s-end").querySelectorAll(".vbtn"),function(b){
      b.addEventListener("click",function(){
        pick=+b.getAttribute("data-v");
        Array.prototype.forEach.call(el("s-end").querySelectorAll(".vbtn"),function(x){x.classList.toggle("on",x===b);});
        el("sendv").disabled=false;
      });
    });
    el("sendv").addEventListener("click",function(){
      if(!pick)return;
      var rec={g:G.id,v:pick,note:el("note").value.trim().slice(0,200),mode:mode,n:players.length,at:new Date().toISOString(),sent:false};
      votes.push(rec);
      saveVotes();
      el("sendv").disabled=true;el("sendv").textContent="Avis enregistré";
      el("note").disabled=true;
      Array.prototype.forEach.call(el("s-end").querySelectorAll(".vbtn"),function(x){x.disabled=true;});
      if(REMOTE){
        el("vmsg").textContent="Envoi…";
        sendRemote(rec).then(function(){rec.sent=true;saveVotes();el("vmsg").textContent="Merci ! Avis envoyé.";},
          function(){el("vmsg").textContent="Enregistré. Il partira tout seul dès que le téléphone aura du réseau.";});
      }else{
        el("vmsg").textContent="Merci ! Il apparaît dans « Retours des tests » sur l'accueil.";
      }
    });
    el("replay").addEventListener("click",startGame);
    el("tohub").addEventListener("click",toHub);
    show("end");
  }

  function toHub(){G=null;document.documentElement.style.setProperty("--ga","#ff4d8d");buildHub();show("hub");}

  el("brand").addEventListener("click",toHub);
  el("back").addEventListener("click",toHub);

  /* appli installable + hors ligne */
  if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){
    window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});
  }
  var deferredInstall=null;
  window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferredInstall=e;if(screens.hub&&!screens.hub.hidden)buildHub();});
  buildHub();
  show("hub");
  flush();
})();
</script>
